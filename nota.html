
<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#ff5722">
  <title>Nota Service - GadgetCare</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: #f1f3f5;
      color: #252a32;
      font-family: Arial, Helvetica, sans-serif;
    }

    .container {
      max-width: 780px;

      padding: 16px;
    }

    .nota {
      background: #fff;
      border-radius: 16px;
      padding: 34px;
      box-shadow: 0 8px 30px rgba(0, 0, 0, .08);
    }

    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
      border-bottom: 3px solid #ff5722;
      padding-bottom: 22px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 30px;
      font-weight: 800;
      letter-spacing: -.7px;
    }

    .brand img {
      width: 54px;
      height: 54px;
      object-fit: contain;
      flex-shrink: 0;
    }

    .gadget {
      color: #222;
    }

    .care {
      color: #ff5722;
    }

    .subtitle {
      color: #7b818a;
      font-size: 13px;
      margin-top: 5px;
    }

    .invoice {
      text-align: right;
      min-width: 0;
    }

    .invoice-title {
      font-size: 22px;
      font-weight: 800;
      letter-spacing: .5px;
    }

    .invoice-code {
      display: inline-block;
      margin-top: 9px;
      padding: 7px 11px;
      border-radius: 7px;
      background: #fff0e9;
      color: #e64a19;
      font-size: 13px;
      font-weight: 700;
      overflow-wrap: anywhere;
    }

    .section {
      margin-top: 28px;
    }

    .section-title {
      color: #e64a19;
      font-size: 12px;
      font-weight: 800;
      letter-spacing: .8px;
      text-transform: uppercase;
      margin-bottom: 15px;
    }

    .info-grid {
      display: grid;
      grid-template-columns: 125px minmax(0, 1fr);
      gap: 13px 14px;
      font-size: 14px;
      line-height: 1.5;
    }

    .label {
      color: #7b818a;
    }

    .value {
      font-weight: 600;
      overflow-wrap: anywhere;
      white-space: pre-wrap;
    }

    .status {
      display: inline-block;
      background: #fff0e9;
      color: #e64a19;
      border-radius: 20px;
      padding: 6px 11px;
      font-size: 12px;
      font-weight: 700;
    }

    .damage-box {
      background: #f7f8fa;
      border-left: 4px solid #ff5722;
      border-radius: 8px;
      padding: 16px;
      line-height: 1.7;
      font-size: 14px;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
    }

    .price-box {
      margin-top: 30px;
      padding: 22px;
      background: #20242c;
      border-radius: 12px;
      color: #fff;
    }

    .price-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 15px;
      padding: 9px 0;
      font-size: 14px;
    }

    .price-row span:last-child {
      text-align: right;
      overflow-wrap: anywhere;
    }

    .total {
      border-top: 1px solid #555b65;
      margin-top: 10px;
      padding-top: 18px;
      font-size: 21px;
      font-weight: 800;
    }

    .total span:last-child {
      color: #ff7043;
    }

    .thankyou {
      margin-top: 28px;
      padding: 24px 18px;
      text-align: center;
      background: #fff7f2;
      border: 1px solid #ffe0d2;
      border-radius: 12px;
    }

    .thankyou-title {
      color: #e64a19;
      font-size: 19px;
      font-weight: 800;
      margin-bottom: 9px;
    }

    .thankyou p {
      margin: 6px 0;
      color: #606671;
      font-size: 13px;
      line-height: 1.7;
    }

    .thankyou-brand {
      color: #252a32;
      font-weight: 800;
      margin-top: 12px;
      font-size: 17px;
    }

    .thankyou-brand span {
      color: #ff5722;
    }

    .footer {
      text-align: center;
      color: #9298a1;
      border-top: 1px solid #e5e7eb;
      margin-top: 22px;
      padding-top: 16px;
      font-size: 11px;
      line-height: 1.7;
    }

    .buttons {
      display: flex;
      gap: 10px;
      margin-top: 22px;
    }

    .buttons button {
      flex: 1;
      border: 0;
      padding: 13px;
      border-radius: 8px;
      color: #fff;
      font-weight: 700;
      cursor: pointer;
      font-size: 14px;
    }

    .print-btn {
      background: #ff5722;
    }

    .wa-btn {
      background: #25d366;
    }

    .close-btn {
      background: #555b65;
    }

    .buttons button:hover {
      filter: brightness(.94);
    }

    .loading,
    .error {
      text-align: center;
      padding: 70px 20px;
    }

    .loading {
      color: #777;
    }

    .error {
      color: #d32f2f;
      overflow-wrap: anywhere;
    }

    .error-code {
      color: #ff5722;
      font-size: 20px;
      font-weight: bold;
    }

    @media (max-width: 600px) {
      .container {
        margin: 0;
        padding: 0;
      }

      .nota {
        min-height: 100vh;
        border-radius: 0;
        padding: 22px 18px;
        box-shadow: none;
      }

      .header {
        align-items: flex-start;
        gap: 16px;
      }

      .brand {
        font-size: 24px;
        gap: 7px;
      }

      .brand img {
        width: 42px;
        height: 42px;
      }

      .subtitle {
        font-size: 11px;
      }

      .invoice-title {
        font-size: 16px;
      }

      .invoice-code {
        font-size: 11px;
        padding: 6px 8px;
      }

      .info-grid {
        grid-template-columns: 95px minmax(0, 1fr);
        gap: 12px 10px;
        font-size: 13px;
      }

      .price-box {
        padding: 17px;
      }

      .total {
        font-size: 19px;
      }

      .buttons {
        flex-direction: column;
      }
    }

    @media (max-width: 360px) {
      .header {
        flex-direction: column;
      }

      .invoice {
        text-align: left;
      }
    }

<body>
  <div class="container">
    <div class="nota">
      <div id="content">
        <div class="loading">Memuat data nota...</div>
      </div>
    </div>
  </div>

  <script>
    const SUPABASE_URL =
      "https://sqpolxwdyypbxylgvihi.supabase.co";

    const SUPABASE_KEY =
      "sb_publishable_rtENTJcEofFn3NbyP76ORw_YY1CwF8G";

    const supabaseClient = supabase.createClient(
      SUPABASE_URL,
      SUPABASE_KEY
    );

    let currentBooking = null;

    // Mengambil kode booking dari URL
    function getBookingCode() {
      const params = new URLSearchParams(
        window.location.search
      );

      return params.get("code");
    }

    // Memuat data nota dari Supabase
    async function loadNota() {
      const code = getBookingCode();
      const content = document.getElementById("content");

      if (!code) {
        showError("Kode booking tidak ditemukan.", "");
        return;
      }

      try {
        const { data, error } = await supabaseClient.rpc(
          "check_booking",
          {
            p_booking_code: code
          }
        );

        if (error) {
          console.error("SUPABASE ERROR:", error);
          showError(
            "Data nota gagal dimuat. " + error.message,
            code
          );
          return;
        }

        if (!data) {
          showError("Data booking tidak ditemukan.", code);
          return;
        }

        currentBooking = Array.isArray(data)
          ? data[0]
          : data;

        if (!currentBooking) {
          showError("Data booking tidak ditemukan.", code);
          return;
        }

        renderNota(currentBooking);
      } catch (error) {
        console.error("Gagal memuat nota:", error);
        showError(
          "Terjadi kesalahan saat memuat nota. Periksa koneksi internet Anda.",
          code
        );
      }
    }

    // Menampilkan pesan jika nota gagal dibuka
    function showError(message, code) {
      document.getElementById("content").innerHTML = `
        <div class="error">
          <h2>Nota tidak dapat dibuka</h2>

          ${
            code
              ? `
                <p>Kode booking:</p>
                <div class="error-code">${escapeHtml(code)}</div>
              `
              : ""
          }

          <p>${escapeHtml(message)}</p>
        </div>
      `;
    }

    // Format rupiah
    function formatRupiah(value) {
      const amount = Number(value || 0);

      return "Rp " + amount.toLocaleString("id-ID");
    }

    // Menampilkan nota
    function renderNota(b) {
      const content = document.getElementById("content");

      const estimated = Number(b.estimated_price || 0);

      const total = Number(
        b.total_price || b.estimated_price || 0
      );

      const date = b.created_at
        ? new Date(b.created_at).toLocaleString("id-ID", {
            dateStyle: "medium",
            timeStyle: "short"
          })
        : "-";

      content.innerHTML = `
        <!-- HEADER NOTA -->
        <div class="header">
          <div>
            <div class="brand">
      
   <img
  src="./logo-nota.png"
  alt="Logo GadgetCare"
  onerror="this.style.display='none'"
>

              <span>
                <span class="gadget">Gadget</span><span class="care">Care</span>
              </span>
            </div>

          <div class="subtitle">
  Service Handphone • Profesional & Terpercaya
  <p class="store-address">
    Dusun Sindanglaya RT.01 RW.07, Desa Sindangsari,
    Kecamatan Sukasari, Kabupaten Sumedang,
    Jawa Barat 45366
  </p>
</div>


          <div class="invoice">
            <div class="invoice-title">NOTA SERVICE</div>
            <div class="invoice-code">
              ${escapeHtml(b.booking_code || "-")}
            </div>
          </div>
        </div>

        <!-- INFORMASI PELANGGAN -->
        <div class="section">
          <div class="section-title">Informasi Pelanggan</div>

          <div class="info-grid">
            <div class="label">Nama</div>
            <div class="value">${escapeHtml(b.customer_name || "-")}</div>

            <div class="label">WhatsApp</div>
            <div class="value">${escapeHtml(b.phone || "-")}</div>

            <div class="label">Alamat</div>
            <div class="value">${escapeHtml(b.address || "-")}</div>
          </div>
        </div>

        <!-- DETAIL PERANGKAT -->
        <div class="section">
          <div class="section-title">Detail Perangkat</div>

          <div class="info-grid">
            <div class="label">Perangkat</div>
            <div class="value">${escapeHtml(b.device || "-")}</div>

            <div class="label">Kerusakan</div>
            <div class="value">${escapeHtml(b.damage || "-")}</div>

            <div class="label">Tanggal Booking</div>
            <div class="value">${escapeHtml(date)}</div>

            <div class="label">Status Service</div>
            <div class="value">
              <span class="status">
                ${escapeHtml(b.status || "Menunggu")}
              </span>
            </div>
          </div>
        </div>

        <!-- KETERANGAN KERUSAKAN -->
        <div class="section">
          <div class="section-title">Keterangan Kerusakan</div>

          <div class="damage-box">${escapeHtml(
            b.description || "Belum ada keterangan kerusakan."
          )}</div>
        </div>

        <!-- RINCIAN HARGA -->
        <div class="price-box">
          <div class="price-row">
            <span>Estimasi Harga</span>
            <span>${formatRupiah(estimated)}</span>
          </div>

          <div class="price-row total">
            <span>TOTAL</span>
            <span>${formatRupiah(total)}</span>
          </div>
        </div>

        <!-- UCAPAN TERIMA KASIH DI BAGIAN BAWAH -->
        <div class="thankyou">
          <div class="thankyou-title">Terima Kasih!</div>

          <p>
            Terima kasih telah mempercayakan perbaikan
            perangkat Anda kepada kami.
          </p>

          <p>
            Kepuasan pelanggan dan kualitas service
            adalah prioritas kami.
          </p>

          <div class="thankyou-brand">
            Gadget<span>Care</span>
          </div>
        </div>

        <div class="footer">
          Simpan nota ini sebagai bukti transaksi service.<br>
          &copy; 2026 GadgetCare • Home Service
        </div>

        <!-- TOMBOL AKSI -->
        <div class="buttons">
          <button
            type="button"
            class="print-btn"
            onclick="window.print()"
          >
            🖨️ Cetak Nota
          </button>

          <button
            type="button"
            class="wa-btn"
            onclick="sendWhatsApp()"
          >
            💬 WhatsApp
          </button>

          <button
            type="button"
            class="close-btn"
            onclick="closeNota()"
          >
            ✕ Tutup
          </button>
        </div>
      `;
    }

    // Mengirim rincian nota melalui WhatsApp
    function sendWhatsApp() {
      if (!currentBooking || !currentBooking.phone) {
        alert("Nomor WhatsApp tidak tersedia.");
        return;
      }

      let number = String(currentBooking.phone)
        .replace(/\D/g, "");

      if (number.startsWith("0")) {
        number = "62" + number.substring(1);
      } else if (number.startsWith("8")) {
        number = "62" + number;
      }

      const b = currentBooking;

      const message = `Halo ${b.customer_name || ""},

Berikut informasi service GadgetCare.

Kode Booking: ${b.booking_code || "-"}
Perangkat: ${b.device || "-"}
Kerusakan: ${b.damage || "-"}
Keterangan: ${b.description || "-"}
Status Service: ${b.status || "Menunggu"}
Estimasi Harga: ${formatRupiah(b.estimated_price)}
Total: ${formatRupiah(
        b.total_price || b.estimated_price
      )}

Terima kasih telah menggunakan GadgetCare.`;

      const url =
        "https://wa.me/" +
        number +
        "?text=" +
        encodeURIComponent(message);

      window.open(url, "_blank");
    }

    // Menutup halaman nota
    function closeNota() {
      if (window.history.length > 1) {
        window.history.back();
      } else {
        window.location.href = "./index.html";
      }
    }

    // Mengamankan teks sebelum ditampilkan sebagai HTML
    function escapeHtml(value) {
      return String(value ?? "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
    }

    // Mulai memuat nota
    loadNota();
  </script>
</body>

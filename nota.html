<!DOCTYPE html>
<html lang="id">

<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0"
>

<title>Nota Service - GadgetCare</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>

*{
  box-sizing:border-box;
}

body{
  margin:0;
  background:#e8e8e8;
  color:#222;
  font-family:Arial,Helvetica,sans-serif;
}

.container{
  max-width:780px;
  margin:30px auto;
  padding:15px;
}

.nota{
  background:#fff;
  border-radius:12px;
  padding:35px;
  box-shadow:0 5px 25px rgba(0,0,0,.12);
}

.header{
  display:flex;
  justify-content:space-between;
  gap:20px;
  border-bottom:3px solid #FF5722;
  padding-bottom:20px;
}

.brand{
  font-size:31px;
  font-weight:800;
}

.gadget{
  color:#222;
}

.care{
  color:#FF5722;
}

.subtitle{
  color:#777;
  margin-top:5px;
}

.invoice{
  text-align:right;
}

.invoice-title{
  font-size:23px;
  font-weight:bold;
}

.invoice-code{
  color:#FF5722;
  font-weight:bold;
  margin-top:7px;
}

.section{
  margin-top:25px;
}

.section-title{
  color:#FF5722;
  font-size:13px;
  font-weight:bold;
  text-transform:uppercase;
  margin-bottom:12px;
}

.info-grid{
  display:grid;
  grid-template-columns:150px 1fr;
  gap:10px;
}

.label{
  color:#777;
}

.value{
  font-weight:600;
  word-break:break-word;
}

.damage-box{
  background:#f5f5f5;
  border-left:4px solid #FF5722;
  border-radius:8px;
  padding:17px;
  line-height:1.6;
  white-space:pre-wrap;
}

.status{
  display:inline-block;
  background:#fff3e0;
  color:#e64a19;
  border-radius:20px;
  padding:7px 12px;
  font-size:13px;
  font-weight:bold;
}

.price-box{
  margin-top:25px;
  padding:20px;
  background:#15181e;
  border-radius:10px;
  color:#fff;
}

.price-row{
  display:flex;
  justify-content:space-between;
  gap:15px;
  padding:7px 0;
}

.total{
  border-top:1px solid #555;
  margin-top:8px;
  padding-top:15px;
  font-size:22px;
  font-weight:bold;
}

.total span:last-child{
  color:#FF5722;
}

.footer{
  text-align:center;
  color:#777;
  border-top:1px solid #ddd;
  margin-top:30px;
  padding-top:20px;
  font-size:13px;
  line-height:1.6;
}

.buttons{
  display:flex;
  gap:10px;
  margin-top:20px;
}

.buttons button{
  flex:1;
  border:0;
  padding:13px;
  border-radius:8px;
  color:#fff;
  font-weight:bold;
  cursor:pointer;
}

.print-btn{
  background:#FF5722;
}

.wa-btn{
  background:#25d366;
}

.close-btn{
  background:#555;
}

.loading{
  text-align:center;
  padding:80px 20px;
  color:#777;
}

.error{
  text-align:center;
  padding:70px 20px;
  color:#d32f2f;
}

.error-code{
  color:#FF5722;
  font-size:20px;
  font-weight:bold;
}

@media(max-width:600px){

  .container{
    margin:0;
    padding:0;
  }

  .nota{
    min-height:100vh;
    border-radius:0;
    padding:20px;
  }

  .header{
    flex-direction:column;
  }

  .invoice{
    text-align:left;
  }

  .info-grid{
    grid-template-columns:110px 1fr;
  }

  .buttons{
    flex-direction:column;
  }

}

@media print{

  body{
    background:#fff;
  }

  .container{
    margin:0;
    padding:0;
    max-width:none;
  }

  .nota{
    box-shadow:none;
    border-radius:0;
  }

  .buttons{
    display:none;
  }

}

</style>

</head>


<body>

<div class="container">

  <div class="nota">

    <div id="content">

      <div class="loading">
        Memuat data nota...
      </div>

    </div>

  </div>

</div>


<script>

const SUPABASE_URL =
  "https://sqpolxwdyypbxylgvihi.supabase.co";

const SUPABASE_KEY =
  "sb_publishable_rtENTJcEofFn3NbyP76ORw_YY1CwF8G";

const supabaseClient =
  supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
  );


let currentBooking = null;


/* =========================
   GET CODE
========================= */

function getBookingCode(){

  const params =
    new URLSearchParams(
      window.location.search
    );

  return params.get("code");

}


/* =========================
   LOAD
========================= */

async function loadNota(){

  const code =
    getBookingCode();


  const content =
    document.getElementById(
      "content"
    );


  if(!code){

    showError(
      "Kode booking tidak ditemukan.",
      ""
    );

    return;
  }


  const {data,error} =
    await supabaseClient.rpc(
      "check_booking",
      {
        p_booking_code:code
      }
    );


  if(error){

    console.error(
      "SUPABASE ERROR:",
      error
    );


    showError(
      error.message,
      code
    );

    return;
  }


  if(!data){

    showError(
      "Data booking tidak ditemukan.",
      code
    );

    return;
  }


  currentBooking =
    Array.isArray(data)
      ? data[0]
      : data;


  if(!currentBooking){

    showError(
      "Data booking tidak ditemukan.",
      code
    );

    return;
  }


  renderNota(
    currentBooking
  );

}


/* =========================
   ERROR
========================= */

function showError(
  message,
  code
){

  document.getElementById(
    "content"
  ).innerHTML = `

    <div class="error">

      <h2>
        Tidak dapat membuka nota
      </h2>

      ${
        code
        ? `
          <p>
            Kode booking:
          </p>

          <div class="error-code">
            ${escapeHtml(code)}
          </div>
        `
        : ""
      }

      <p>
        ${escapeHtml(message)}
      </p>

    </div>

  `;

}


/* =========================
   RENDER
========================= */

function renderNota(b){

  const content =
    document.getElementById(
      "content"
    );


  const estimated =
    Number(
      b.estimated_price || 0
    );


  const total =
    Number(
      b.total_price ||
      b.estimated_price ||
      0
    );


  const date =
    b.created_at
      ? new Date(
          b.created_at
        ).toLocaleString(
          "id-ID",
          {
            dateStyle:"medium",
            timeStyle:"short"
          }
        )
      : "-";


  content.innerHTML = `

    <!-- HEADER -->

    <div class="header">

      <div>

        <div class="brand">

          <span class="gadget">
            Gadget
          </span><span class="care">
            Care
          </span>

        </div>

        <div class="subtitle">
          Service Handphone
        </div>

      </div>


      <div class="invoice">

        <div class="invoice-title">
          NOTA SERVICE
        </div>

        <div class="invoice-code">
          ${escapeHtml(
            b.booking_code || "-"
          )}
        </div>

      </div>

    </div>


    <!-- PELANGGAN -->

    <div class="section">

      <div class="section-title">
        Informasi Pelanggan
      </div>


      <div class="info-grid">

        <div class="label">
          Nama
        </div>

        <div class="value">
          ${escapeHtml(
            b.customer_name || "-"
          )}
        </div>


        <div class="label">
          WhatsApp
        </div>

        <div class="value">
          ${escapeHtml(
            b.phone || "-"
          )}
        </div>


        <div class="label">
          Alamat
        </div>

        <div class="value">
          ${escapeHtml(
            b.address || "-"
          )}
        </div>

      </div>

    </div>


    <!-- PERANGKAT -->

    <div class="section">

      <div class="section-title">
        Detail Perangkat
      </div>


      <div class="info-grid">

        <div class="label">
          Perangkat
        </div>

        <div class="value">
          ${escapeHtml(
            b.device || "-"
          )}
        </div>


        <div class="label">
          Kerusakan
        </div>

        <div class="value">
          ${escapeHtml(
            b.damage || "-"
          )}
        </div>


        <div class="label">
          Tanggal
        </div>

        <div class="value">
          ${date}
        </div>


        <div class="label">
          Status
        </div>

        <div class="value">

          <span class="status">
            ${escapeHtml(
              b.status || "Menunggu"
            )}
          </span>

        </div>

      </div>

    </div>


    <!-- KETERANGAN KERUSAKAN -->

    <div class="section">

      <div class="section-title">
        Keterangan Kerusakan
      </div>


      <div class="damage-box">

        ${escapeHtml(
          b.description ||
          "Belum ada keterangan kerusakan."
        )}

      </div>

    </div>


    <!-- HARGA -->

    <div class="price-box">

      <div class="price-row">

        <span>
          Estimasi Harga
        </span>

        <span>
          Rp ${estimated.toLocaleString("id-ID")}
        </span>

      </div>


      <div class="price-row total">

        <span>
          TOTAL
        </span>

        <span>
          Rp ${total.toLocaleString("id-ID")}
        </span>

      </div>

    </div>


    <!-- FOOTER -->

    <div class="footer">

      Terima kasih telah menggunakan
      <b>GadgetCare</b>.

      <br>

      Simpan nota ini sebagai bukti service.

    </div>


    <!-- BUTTON -->

    <div class="buttons">

      <button
        class="print-btn"
        onclick="window.print()"
      >
        🖨️ Cetak Nota
      </button>


      <button
        class="wa-btn"
        onclick="sendWhatsApp()"
      >
        💬 WhatsApp
      </button>


      <button
        class="close-btn"
        onclick="window.close()"
      >
        ✕ Tutup
      </button>

    </div>

  `;

}


/* =========================
   WHATSAPP
========================= */

function sendWhatsApp(){

  if(
    !currentBooking ||
    !currentBooking.phone
  ){

    alert(
      "Nomor WhatsApp tidak tersedia."
    );

    return;
  }


  let number =
    String(
      currentBooking.phone
    )
      .replace(/\D/g,"");


  if(number.startsWith("0")){

    number =
      "62" +
      number.substring(1);

  }


  const message =

`Halo ${currentBooking.customer_name || ""},

Berikut informasi service GadgetCare.

Kode Booking: ${currentBooking.booking_code || "-"}
Perangkat: ${currentBooking.device || "-"}
Kerusakan: ${currentBooking.damage || "-"}
Keterangan: ${currentBooking.description || "-"}
Status: ${currentBooking.status || "-"}
Total: Rp ${Number(currentBooking.total_price || currentBooking.estimated_price || 0).toLocaleString("id-ID")}

Terima kasih telah menggunakan GadgetCare.`;


  window.open(
    "https://wa.me/" +
    number +
    "?text=" +
    encodeURIComponent(message),
    "_blank"
  );

}


/* =========================
   ESCAPE
========================= */

function escapeHtml(value){

  return String(value ?? "")
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");

}


/* =========================
   START
========================= */

loadNota();

</script>

</body>
</html>

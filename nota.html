<!DOCTYPE html>
<html lang="id">
<head>

  <meta charset="UTF-8">

  <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

  <title>GadgetCare - Nota Service</title>

  <link rel="icon" href="./logo.png">

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, sans-serif;
      background: #0b0f14;
      color: #fff;
      padding: 30px 15px;
    }

    .container {
      max-width: 700px;
      margin: auto;
    }

    .invoice {
      background: #fff;
      color: #111;
      border-radius: 12px;
      overflow: hidden;
    }

    .invoice-header {
      background: #111820;
      color: white;
      padding: 25px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 20px;
    }

    .brand {
      font-size: 27px;
      font-weight: 800;
    }

    .gadget {
      color: #fff;
    }

    .care {
      color: #FF5722;
    }

    .invoice-title {
      text-align: right;
    }

    .invoice-title h2 {
      font-size: 20px;
    }

    .invoice-title p {
      color: #adb5bd;
      font-size: 12px;
    }

    .invoice-body {
      padding: 28px;
    }

    .section {
      margin-bottom: 25px;
    }

    .section h3 {
      font-size: 14px;
      color: #FF5722;
      border-bottom: 2px solid #FF5722;
      padding-bottom: 7px;
      margin-bottom: 12px;
    }

    .row {
      display: flex;
      justify-content: space-between;
      gap: 15px;
      padding: 7px 0;
      border-bottom: 1px solid #eee;
      font-size: 14px;
    }

    .label {
      color: #777;
    }

    .value {
      text-align: right;
      font-weight: 600;
    }

    .status {
      display: inline-block;
      background: #fff0eb;
      color: #FF5722;
      padding: 5px 10px;
      border-radius: 20px;
      font-size: 12px;
    }

    .total {
      display: flex;
      justify-content: space-between;
      font-size: 20px;
      font-weight: 800;
      padding-top: 15px;
      border-top: 2px solid #111;
    }

    .footer {
      text-align: center;
      color: #777;
      font-size: 12px;
      margin-top: 25px;
      line-height: 1.7;
    }

    .actions {
      display: flex;
      gap: 10px;
      justify-content: center;
      margin-top: 20px;
    }

    button {
      padding: 11px 17px;
      border: 0;
      border-radius: 8px;
      cursor: pointer;
      font-weight: 700;
    }

    .print {
      background: #FF5722;
      color: white;
    }

    .back {
      background: #1b232c;
      color: white;
    }

    .error {
      text-align: center;
      background: #111820;
      border: 1px solid #293440;
      padding: 25px;
      border-radius: 12px;
    }

    @media print {

      body {
        background: white;
        padding: 0;
      }

      .actions {
        display: none;
      }

      .invoice {
        box-shadow: none;
      }

    }

    @media (max-width: 600px) {

      .invoice-header {
        flex-direction: column;
        align-items: flex-start;
      }

      .invoice-title {
        text-align: left;
      }

      .row {
        flex-direction: column;
        gap: 2px;
      }

      .value {
        text-align: left;
      }

    }

  </style>

</head>

<body>

<div class="container">

  <div id="content">
    Memuat nota...
  </div>

</div>


<script>

  const SUPABASE_URL =
    "https://sqpolxwdyypbxylgvihi.supabase.co";

  const SUPABASE_KEY =
    "sb_publishable_rtENTJcEofFn3NbyP76ORw_YY1CwF8G";

  const supabaseClient =
    window.supabase.createClient(
      SUPABASE_URL,
      SUPABASE_KEY
    );


  function rupiah(number) {

    return "Rp" +
      Number(number || 0)
        .toLocaleString("id-ID");

  }


  function escapeHtml(value) {

    if (value === null || value === undefined)
      return "";

    return String(value)
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;")
      .replace(/'/g, "&#039;");

  }


  async function loadNota() {

    const params =
      new URLSearchParams(
        window.location.search
      );

    const kode =
      params.get("kode");


    if (!kode) {

      document.getElementById("content")
        .innerHTML = `
          <div class="error">
            <h2>Kode booking tidak ditemukan.</h2>
            <p style="margin-top:8px;">
              Silakan buka nota melalui Admin Dashboard.
            </p>
          </div>
        `;

      return;
    }


    try {

      const {
        data,
        error
      } = await supabaseClient.rpc(
        "check_booking",
        {
          p_booking_code: kode
        }
      );


      if (error) {
        throw error;
      }


      if (!data || data.length === 0) {

        document.getElementById("content")
          .innerHTML = `
            <div class="error">
              <h2>Booking tidak ditemukan.</h2>
              <p style="margin-top:8px;">
                Kode: ${escapeHtml(kode)}
              </p>
            </div>
          `;

        return;
      }


      const booking =
        Array.isArray(data)
          ? data[0]
          : data;


      const date =
        booking.created_at
          ? new Date(booking.created_at)
              .toLocaleString("id-ID")
          : "-";


      document.getElementById("content")
        .innerHTML = `

        <div class="invoice">

          <div class="invoice-header">

            <div>

              <div class="brand">
                <span class="gadget">Gadget</span><span class="care">Care</span>
              </div>

              <div style="
                color:#adb5bd;
                font-size:12px;
                margin-top:4px;
              ">
                Home Service & Repair Gadget
              </div>

            </div>


            <div class="invoice-title">

              <h2>NOTA SERVICE</h2>

              <p>
                ${escapeHtml(date)}
              </p>

            </div>

          </div>


          <div class="invoice-body">


            <div class="section">

              <h3>DATA PELANGGAN</h3>

              <div class="row">
                <span class="label">
                  Kode Booking
                </span>

                <span class="value">
                  ${escapeHtml(booking.booking_code)}
                </span>
              </div>


              <div class="row">

                <span class="label">
                  Nama
                </span>

                <span class="value">
                  ${escapeHtml(booking.customer_name)}
                </span>

              </div>


            </div>


            <div class="section">

              <h3>DETAIL PERANGKAT</h3>


              <div class="row">

                <span class="label">
                  Gadget
                </span>

                <span class="value">
                  ${escapeHtml(booking.device)}
                </span>

              </div>


              <div class="row">

                <span class="label">
                  Kerusakan
                </span>

                <span class="value">
                  ${escapeHtml(booking.damage)}
                </span>

              </div>


              <div class="row">

                <span class="label">
                  Status
                </span>

                <span class="value">

                  <span class="status">
                    ${escapeHtml(booking.status)}
                  </span>

                </span>

              </div>


            </div>


            <div class="section">

              <h3>PEMBAYARAN</h3>


              <div class="row">

                <span class="label">
                  Estimasi Harga
                </span>

                <span class="value">
                  ${rupiah(booking.estimated_price)}
                </span>

              </div>


              <div class="total">

                <span>
                  TOTAL
                </span>

                <span style="color:#FF5722;">
                  ${rupiah(booking.total_price)}
                </span>

              </div>

            </div>


            <div class="footer">

              Terima kasih telah menggunakan
              <strong>GadgetCare</strong>.<br>

              Home Service & Repair Gadget

            </div>


          </div>

        </div>


        <div class="actions">

          <button
            class="print"
            onclick="window.print()">
            🖨️ Cetak Nota
          </button>


          <button
            class="back"
            onclick="window.close()">
            Tutup
          </button>

        </div>

      `;

    } catch (error) {

      console.error(error);

      document.getElementById("content")
        .innerHTML = `
          <div class="error">
            <h2>Gagal memuat nota.</h2>
            <p style="margin-top:8px;">
              ${escapeHtml(error.message)}
            </p>
          </div>
        `;

    }

  }


  loadNota();

</script>

</body>
</html>

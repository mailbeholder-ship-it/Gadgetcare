<!DOCTYPE html>
<html lang="id">

<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0"
>

<title>Nota Service - GadgetCare</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>

* {
  box-sizing: border-box;
}

body {
  margin: 0;
  background: #e9e9e9;
  font-family: Arial, Helvetica, sans-serif;
  color: #222;
}

.container {
  max-width: 760px;
  margin: 30px auto;
  padding: 15px;
}

.nota {
  background: white;
  padding: 35px;
  border-radius: 12px;
  box-shadow: 0 5px 25px rgba(0,0,0,.12);
}

.header {
  display: flex;
  justify-content: space-between;
  gap: 20px;
  align-items: flex-start;
  border-bottom: 3px solid #FF5722;
  padding-bottom: 20px;
}

.brand {
  font-size: 30px;
  font-weight: 800;
}

.gadget {
  color: #222;
}

.care {
  color: #FF5722;
}

.subtitle {
  color: #777;
  margin-top: 5px;
}

.invoice {
  text-align: right;
}

.invoice-title {
  font-size: 24px;
  font-weight: bold;
}

.invoice-code {
  color: #FF5722;
  font-weight: bold;
  margin-top: 5px;
}

.section {
  margin-top: 25px;
}

.section-title {
  font-size: 14px;
  font-weight: bold;
  color: #FF5722;
  text-transform: uppercase;
  margin-bottom: 10px;
}

.info-grid {
  display: grid;
  grid-template-columns: 150px 1fr;
  gap: 8px 15px;
}

.label {
  color: #777;
}

.value {
  font-weight: 600;
  word-break: break-word;
}

.damage-box {
  background: #f6f6f6;
  padding: 15px;
  border-radius: 8px;
  border-left: 4px solid #FF5722;
}

.price-box {
  margin-top: 25px;
  background: #171a21;
  color: white;
  padding: 20px;
  border-radius: 10px;
}

.price-row {
  display: flex;
  justify-content: space-between;
  padding: 7px 0;
}

.total {
  border-top: 1px solid #555;
  margin-top: 8px;
  padding-top: 15px;
  font-size: 22px;
  font-weight: bold;
  color: #FF5722;
}

.status {
  display: inline-block;
  padding: 7px 12px;
  border-radius: 20px;
  background: #fff3e0;
  color: #e64a19;
  font-weight: bold;
}

.footer {
  text-align: center;
  border-top: 1px solid #ddd;
  margin-top: 30px;
  padding-top: 20px;
  color: #777;
  font-size: 13px;
}

.buttons {
  display: flex;
  gap: 10px;
  margin-top: 20px;
}

.buttons button {
  flex: 1;
  border: none;
  padding: 13px;
  border-radius: 8px;
  cursor: pointer;
  color: white;
  font-weight: bold;
}

.print {
  background: #FF5722;
}

.whatsapp {
  background: #25d366;
}

.back {
  background: #555;
}

.loading {
  text-align: center;
  padding: 80px 20px;
  color: #777;
}

.error {
  text-align: center;
  padding: 80px 20px;
  color: #d32f2f;
}

@media(max-width:600px) {

  .container {
    margin: 0;
    padding: 0;
  }

  .nota {
    border-radius: 0;
    padding: 20px;
    min-height: 100vh;
  }

  .header {
    flex-direction: column;
  }

  .invoice {
    text-align: left;
  }

  .info-grid {
    grid-template-columns: 110px 1fr;
  }

  .buttons {
    flex-direction: column;
  }

}

@media print {

  body {
    background: white;
  }

  .container {
    margin: 0;
    padding: 0;
    max-width: none;
  }

  .nota {
    box-shadow: none;
    border-radius: 0;
  }

  .buttons {
    display: none;
  }

}

</style>

</head>


<body>

<div class="container">

  <div class="nota">

    <div id="content">

      <div class="loading">
        Memuat nota...
      </div>

    </div>

  </div>

</div>


<script>

const SUPABASE_URL =
  "https://sqpolxwdyypbxylgvihi.supabase.co";

const SUPABASE_KEY =
  "sb_publishable_rtENTJcEofFn3NbyP76ORw_YY1CwF8G";

const supabaseClient =
  supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
  );


let currentBooking = null;


/* =========================
   GET BOOKING CODE
========================= */

function getBookingCode() {

  const params =
    new URLSearchParams(
      window.location.search
    );

  return params.get("code");

}


/* =========================
   LOAD NOTA
========================= */

async function loadNota() {

  const bookingCode =
    getBookingCode();

  const content =
    document.getElementById("content");


  if (!bookingCode) {

    content.innerHTML = `
      <div class="error">

        <h2>Kode Booking Tidak Ditemukan</h2>

        <p>
          Silakan buka nota melalui tombol
          <b>🧾 Nota</b> pada halaman Admin.
        </p>

      </div>
    `;

    return;
  }


  const { data, error } =
    await supabaseClient.rpc(
      "check_booking",
      {
        p_booking_code: bookingCode
      }
    );


  if (error) {

    console.error(
      "SUPABASE ERROR:",
      error
    );

    content.innerHTML = `
      <div class="error">

        <h2>Gagal Memuat Nota</h2>

        <p>
          ${escapeHtml(error.message)}
        </p>

        <p>
          Kode booking:
          <b>${escapeHtml(bookingCode)}</b>
        </p>

      </div>
    `;

    return;
  }


  if (!data || data.length === 0) {

    content.innerHTML = `
      <div class="error">

        <h2>Booking Tidak Ditemukan</h2>

        <p>
          Tidak ada data dengan kode:
        </p>

        <h3>
          ${escapeHtml(bookingCode)}
        </h3>

      </div>
    `;

    return;
  }


  currentBooking =
    Array.isArray(data)
      ? data[0]
      : data;


  renderNota(currentBooking);

}


/* =========================
   RENDER NOTA
========================= */

function renderNota(b) {

  const content =
    document.getElementById("content");


  const price =
    Number(
      b.total_price ||
      b.estimated_price ||
      0
    );


  const formattedPrice =
    price.toLocaleString("id-ID");


  const created =
    b.created_at
      ? new Date(b.created_at)
          .toLocaleString(
            "id-ID",
            {
              dateStyle: "medium",
              timeStyle: "short"
            }
          )
      : "-";


  content.innerHTML = `

    <div class="header">

      <div>

        <div class="brand">

          <span class="gadget">
            Gadget
          </span><span class="care">
            Care
          </span>

        </div>

        <div class="subtitle">
          Service Handphone
        </div>

      </div>


      <div class="invoice">

        <div class="invoice-title">
          NOTA SERVICE
        </div>

        <div class="invoice-code">
          ${escapeHtml(
            b.booking_code || "-"
          )}
        </div>

      </div>

    </div>


    <div class="section">

      <div class="section-title">
        Informasi Pelanggan
      </div>

      <div class="info-grid">

        <div class="label">
          Nama
        </div>

        <div class="value">
          ${escapeHtml(
            b.customer_name || "-"
          )}
        </div>


        <div class="label">
          WhatsApp
        </div>

        <div class="value">
          ${escapeHtml(
            b.phone || "-"
          )}
        </div>


        <div class="label">
          Alamat
        </div>

        <div class="value">
          ${escapeHtml(
            b.address || "-"
          )}
        </div>

      </div>

    </div>


    <div class="section">

      <div class="section-title">
        Detail Perangkat
      </div>

      <div class="info-grid">

        <div class="label">
          Perangkat
        </div>

        <div class="value">
          ${escapeHtml(
            b.device || "-"
          )}
        </div>


        <div class="label">
          Kerusakan
        </div>

        <div class="value">
          ${escapeHtml(
            b.damage || "-"
          )}
        </div>


        <div class="label">
          Tanggal
        </div>

        <div class="value">
          ${created}
        </div>


        <div class="label">
          Status
        </div>

        <div class="value">

          <span class="status">
            ${escapeHtml(
              b.status || "Menunggu"
            )}
          </span>

        </div>

      </div>

    </div>


    <div class="section">

      <div class="section-title">
        Keterangan Kerusakan
      </div>

      <div class="damage-box">

        ${escapeHtml(
          b.description ||
         <div class="damage-box">
  ${escapeHtml(
    b.description ||
    "Tidak ada keterangan tambahan."
  )}
</div>

    </div>


    <div class="price-box">

      <div class="price-row">

        <span>
          Estimasi Harga
        </span>

        <span>
          Rp ${Number(
            b.estimated_price || 0
          ).toLocaleString("id-ID")}
        </span>

      </div>


      <div class="price-row total">

        <span>
          TOTAL
        </span>

        <span>
          Rp ${formattedPrice}
        </span>

      </div>

    </div>


    <div class="footer">

      Terima kasih telah menggunakan
      <b>GadgetCare</b>.

      <br>

      Simpan nota ini sebagai bukti service.

    </div>


    <div class="buttons">

      <button
        class="print"
        onclick="window.print()"
      >
        🖨️ Cetak Nota
      </button>


      <button
        class="whatsapp"
        onclick="sendWhatsApp()"
      >
        💬 WhatsApp
      </button>


      <button
        class="back"
        onclick="window.close()"
      >
        ✕ Tutup
      </button>

    </div>

  `;

}


/* =========================
   WHATSAPP
========================= */

function sendWhatsApp() {

  if (
    !currentBooking ||
    !currentBooking.phone
  ) {

    alert(
      "Nomor WhatsApp pelanggan tidak tersedia."
    );

    return;
  }


  let number =
    String(
      currentBooking.phone
    ).replace(/\D/g, "");


  if (number.startsWith("0")) {

    number =
      "62" +
      number.substring(1);

  }


  const code =
    currentBooking.booking_code || "-";


  const message =
`Halo ${currentBooking.customer_name || ""},

Ini informasi service dari GadgetCare.

Kode Booking: ${code}
Perangkat: ${currentBooking.device || "-"}
Kerusakan: ${currentBooking.damage || "-"}
Status: ${currentBooking.status || "-"}
Total: Rp ${Number(currentBooking.total_price || currentBooking.estimated_price || 0).toLocaleString("id-ID")}

Terima kasih telah menggunakan GadgetCare.`;


  window.open(
    "https://wa.me/" +
    number +
    "?text=" +
    encodeURIComponent(message),
    "_blank"
  );

}


/* =========================
   ESCAPE
========================= */

function escapeHtml(value) {

  return String(value ?? "")
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#039;");

}


/* =========================
   START
========================= */

loadNota();

</script>

</body>

</html>

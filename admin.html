<style>
* {

body {

.header {

.actions {

.btn-price {

.btn-status {

.btn-wa {

.empty {

.modal {

  position: fixed;
  inset: 0;

.modal-box {

<script>

const SUPABASE_URL =
  "https://sqpolxwdyypbxylgvihi.supabase.co";

const SUPABASE_KEY =
  "sb_publishable_rtENTJcEofFn3NbyP76ORw_YY1CwF8G";

const supabaseClient =
  supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
  );


let bookings = [];
let selectedBooking = null;


/* =========================
   LOGIN
========================= */

async function login() {

  const email =
    document.getElementById("email").value.trim();

  const password =
    document.getElementById("password").value;

  const message =
    document.getElementById("loginMessage");

  message.textContent = "";

  if (!email || !password) {

    message.textContent =
      "Email dan password wajib diisi.";

    return;
  }

  const { error } =
    await supabaseClient.auth.signInWithPassword({
      email,
      password
    });

  if (error) {

    console.error(error);

    message.textContent =
      "Login gagal: " + error.message;

    return;
  }

  showAdmin();

}


/* =========================
   CHECK SESSION
========================= */

async function checkSession() {

  const { data } =
    await supabaseClient.auth.getSession();

  if (data.session) {

    showAdmin();

  } else {

    document.getElementById("loginSection")
      .style.display = "block";

    document.getElementById("adminSection")
      .style.display = "none";

  }

}


/* =========================
   SHOW ADMIN
========================= */

function showAdmin() {

  document.getElementById("loginSection")
    .style.display = "none";

  document.getElementById("adminSection")
    .style.display = "block";

  loadBookings();

}


/* =========================
   LOGOUT
========================= */

async function logout() {

  await supabaseClient.auth.signOut();

  location.reload();

}


/* =========================
   LOAD BOOKINGS
========================= */

async function loadBookings() {

  const tbody =
    document.getElementById("bookingTable");

  tbody.innerHTML = `
    <tr>
      <td colspan="11" class="empty">
        Memuat data...
      </td>
    </tr>
  `;

  const { data, error } =
    await supabaseClient
      .from("bookings")
      .select("*")
      .order("created_at", {
        ascending: false
      });

  if (error) {

    console.error(error);

    tbody.innerHTML = `
      <tr>
        <td colspan="11" class="empty">
          Gagal mengambil data booking.<br>
          ${escapeHtml(error.message)}
        </td>
      </tr>
    `;

    return;
  }

  bookings = data || [];

  updateStats();

  renderBookings(bookings);

}

/* =========================
   STATS
========================= */

function updateStats() {

  document.getElementById("totalBooking")
    .textContent = bookings.length;

  document.getElementById("waitingBooking")
    .textContent =
      bookings.filter(
        b => b.status === "Menunggu"
      ).length;

  document.getElementById("processBooking")
    .textContent =
      bookings.filter(
        b => b.status === "Diproses"
      ).length;

  document.getElementById("doneBooking")
    .textContent =
      bookings.filter(
        b => b.status === "Selesai"
      ).length;

}


/* =========================
   FILTER
========================= */

function filterBookings() {

  const search =
    document.getElementById("search")
      .value
      .toLowerCase();

  const status =
    document.getElementById("filterStatus")
      .value;

  const filtered =
    bookings.filter(b => {

      const text = `
        ${b.booking_code || ""}
        ${b.customer_name || ""}
        ${b.phone || ""}
        ${b.device || ""}
        ${b.damage || ""}
        ${b.description || ""}
        ${b.address || ""}
      `.toLowerCase();

      const matchSearch =
        text.includes(search);

      const matchStatus =
        !status || b.status === status;

      return matchSearch && matchStatus;

    });

  renderBookings(filtered);

}


/* =========================
   RENDER
========================= */

function renderBookings(data) {

  const tbody =
    document.getElementById("bookingTable");

  if (!data.length) {

    tbody.innerHTML = `
      <tr>
        <td colspan="11" class="empty">
          Tidak ada booking.
        </td>
      </tr>
    `;

    return;
  }

  tbody.innerHTML =
    data.map(b => {

      const price =
        Number(b.total_price || b.estimated_price || 0)
          .toLocaleString("id-ID");

      const date =
        b.created_at
          ? new Date(b.created_at)
              .toLocaleString("id-ID")
          : "-";

      return `

        <tr>

          <td>
            <span class="code">
              ${escapeHtml(b.booking_code || "-")}
            </span>
          </td>

          <td>
            ${escapeHtml(b.customer_name || "-")}
          </td>

          <td>
            ${escapeHtml(b.phone || "-")}
          </td>

          <td>
            ${escapeHtml(b.device || "-")}
          </td>

          <td>
            <span class="damage">
              ${escapeHtml(b.damage || "-")}
            </span>
          </td>

          <td>
            <div class="description">
              ${escapeHtml(b.description || "-")}
            </div>
          </td>

          <td>
            ${escapeHtml(b.address || "-")}
          </td>

          <td>
            ${statusBadge(b.status)}
          </td>

          <td>
            Rp ${price}
          </td>

          <td>
            ${date}
          </td>

          <td>

            <div class="actions">

              <button
                class="action btn-price"
                onclick="openPriceModal('${b.id}')"
              >
                💰 Harga
              </button>

              <button
                class="action btn-status"
                onclick="openStatusModal('${b.id}')"
              >
                🔄 Status
              </button>

              <button
                class="action btn-wa"
                onclick="openWhatsApp('${escapeJs(b.phone)}')"
              >
                💬 WA
              </button>

              <button
                class="action btn-map"
                onclick="openMap('${escapeJs(b.latitude)}','${escapeJs(b.longitude)}','${escapeJs(b.address)}')"
              >
                📍 Map
              </button>

              <button
                class="action btn-nota"
                onclick="openNota('${escapeJs(b.booking_code)}')"
              >
                🧾 Nota
              </button>

            </div>

          </td>

        </tr>

      `;

    }).join("");

}


/* =========================
   STATUS BADGE
========================= */

function statusBadge(status) {

  const value = status || "Menunggu";

  let cls = "status-menunggu";

  if (value === "Diproses")
    cls = "status-proses";

  if (value === "Selesai")
    cls = "status-selesai";

  if (value === "Sudah Diambil")
    cls = "status-diambil";

  if (value === "Dibatalkan")
    cls = "status-batal";

  return `
    <span class="status ${cls}">
      ${escapeHtml(value)}
    </span>
  `;

}


/* =========================
   PRICE MODAL
========================= */

function openPriceModal(id) {

  selectedBooking =
    bookings.find(b => b.id === id);

  if (!selectedBooking) return;

  document.getElementById("priceBookingCode")
    .textContent =
      "Booking: " +
      selectedBooking.booking_code;

  document.getElementById("priceInput")
    .value =
      selectedBooking.total_price ||
      selectedBooking.estimated_price ||
      "";

  document.getElementById("priceModal")
    .style.display = "flex";

}


function closePriceModal() {

  document.getElementById("priceModal")
    .style.display = "none";

  selectedBooking = null;

}


async function savePrice() {

  if (!selectedBooking) return;

  const price =
    Number(
      document.getElementById("priceInput").value
    );

  if (isNaN(price) || price < 0) {

    alert("Harga tidak valid.");

    return;
  }

  const { data, error } =
    await supabaseClient.rpc(
      "update_booking_price",
      {
        p_booking_id: selectedBooking.id,
        p_price: price
      }
    );

  if (error) {

    console.error(error);

    alert(
      "Gagal mengubah harga:\n" +
      error.message
    );

    return;
  }

  if (data === false) {

    alert("Data booking tidak ditemukan.");

    return;
  }

  closePriceModal();

  await loadBookings();

}


/* =========================
   STATUS MODAL
========================= */

function openStatusModal(id) {

  selectedBooking =
    bookings.find(b => b.id === id);

  if (!selectedBooking) return;

  document.getElementById("statusBookingCode")
    .textContent =
      "Booking: " +
      selectedBooking.booking_code;

  document.getElementById("statusInput")
    .value =
      selectedBooking.status || "Menunggu";

  document.getElementById("statusModal")
    .style.display = "flex";

}


function closeStatusModal() {

  document.getElementById("statusModal")
    .style.display = "none";

  selectedBooking = null;

}


async function saveStatus() {

  if (!selectedBooking) return;

  const status =
    document.getElementById("statusInput").value;

  const { error } =
    await supabaseClient
      .from("bookings")
      .update({
        status: status
      })
      .eq("id", selectedBooking.id);

  if (error) {

    console.error(error);

    alert(
      "Gagal mengubah status:\n" +
      error.message
    );

    return;
  }

  closeStatusModal();

  await loadBookings();

}


/* =========================
   WHATSAPP
========================= */

function openWhatsApp(phone) {

  if (!phone) {

    alert("Nomor WhatsApp tidak tersedia.");

    return;
  }

  let number =
    String(phone)
      .replace(/\D/g, "");

  if (number.startsWith("0")) {

    number =
      "62" + number.substring(1);

  }

  window.open(
    "https://wa.me/" + number,
    "_blank"
  );

}


/* =========================
   MAP
========================= */

function openMap(lat, lng, address) {

  if (lat && lng && lat !== "null" && lng !== "null") {

    window.open(
      `https://www.google.com/maps?q=${encodeURIComponent(lat)},${encodeURIComponent(lng)}`,
      "_blank"
    );

    return;
  }

  if (address) {

    window.open(
      `https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(address)}`,
      "_blank"
    );

    return;
  }

  alert("Lokasi tidak tersedia.");

}


/* =========================
   NOTA
========================= */

function openNota(bookingCode) {

  if (!bookingCode) {

    alert("Kode booking tidak ditemukan.");

    return;
  }

  const url =
    "./nota.html?code=" +
    encodeURIComponent(bookingCode);

  window.open(url, "_blank");

}


/* =========================
   ESCAPE HTML
========================= */

function escapeHtml(value) {

  return String(value ?? "")
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#039;");

}


function escapeJs(value) {

  return String(value ?? "")
    .replace(/\\/g, "\\\\")
    .replace(/'/g, "\\'")
    .replace(/\n/g, "\\n")
    .replace(/\r/g, "\\r");

}

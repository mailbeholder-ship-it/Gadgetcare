<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>GadgetCare - Admin</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, Helvetica, sans-serif;
    background: #0f1115;
    color: #fff;
}

/* =========================
   HEADER
========================= */

header {
    background: #151820;
    border-bottom: 1px solid #292d36;
    padding: 15px 25px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    position: sticky;
    top: 0;
    z-index: 100;
}

.brand {
    text-decoration: none;
    font-size: 25px;
    font-weight: 800;
}

.gadget {
    color: #fff;
}

.care {
    color: #FF5722;
}

.header-right {
    display: flex;
    align-items: center;
    gap: 10px;
}

.logout-btn {
    background: #ff3d3d;
    border: none;
    color: white;
    padding: 9px 14px;
    border-radius: 8px;
    cursor: pointer;
    font-weight: bold;
}

/* =========================
   LOGIN
========================= */

#loginPage {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
}

.login-box {
    width: 100%;
    max-width: 420px;
    background: #171a21;
    border: 1px solid #292d36;
    padding: 30px;
    border-radius: 18px;
    box-shadow: 0 20px 60px rgba(0,0,0,.4);
}

.login-box h1 {
    margin-top: 0;
    text-align: center;
}

.login-box p {
    text-align: center;
    color: #9da3ae;
}

.input {
    width: 100%;
    background: #0f1115;
    border: 1px solid #343945;
    color: white;
    padding: 13px;
    border-radius: 9px;
    margin-bottom: 13px;
    outline: none;
}

.input:focus {
    border-color: #FF5722;
}

.primary-btn {
    width: 100%;
    background: #FF5722;
    color: white;
    border: none;
    padding: 13px;
    border-radius: 9px;
    cursor: pointer;
    font-weight: bold;
}

.alert {
    margin-top: 15px;
    padding: 12px;
    border-radius: 8px;
    background: #351b1b;
    color: #ff7777;
    display: none;
}

/* =========================
   ADMIN
========================= */

#adminPage {
    display: none;
}

.container {
    max-width: 1500px;
    margin: auto;
    padding: 25px;
}

.page-title {
    margin-bottom: 20px;
}

.page-title h1 {
    margin: 0;
}

.page-title p {
    color: #9299a5;
}

/* =========================
   STATISTIC
========================= */

.stats {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 15px;
    margin-bottom: 25px;
}

.stat-card {
    background: #171a21;
    border: 1px solid #292d36;
    border-radius: 14px;
    padding: 20px;
}

.stat-title {
    color: #9299a5;
    font-size: 14px;
}

.stat-number {
    font-size: 28px;
    font-weight: bold;
    margin-top: 8px;
}

/* =========================
   FILTER
========================= */

.toolbar {
    background: #171a21;
    border: 1px solid #292d36;
    border-radius: 14px;
    padding: 15px;
    margin-bottom: 20px;
    display: flex;
    gap: 10px;
    flex-wrap: wrap;
}

.search {
    flex: 1;
    min-width: 230px;
}

select.input {
    width: auto;
    min-width: 180px;
    margin: 0;
}

/* =========================
   TABLE
========================= */

.table-container {
    background: #171a21;
    border: 1px solid #292d36;
    border-radius: 14px;
    overflow: auto;
}

table {
    width: 100%;
    border-collapse: collapse;
    min-width: 1300px;
}

th {
    background: #20242c;
    color: #dfe2e7;
    text-align: left;
    padding: 13px;
    font-size: 13px;
    white-space: nowrap;
}

td {
    padding: 13px;
    border-top: 1px solid #292d36;
    vertical-align: top;
    font-size: 13px;
}

tr:hover {
    background: #1c2027;
}

.device {
    font-weight: bold;
    color: #fff;
}

.damage {
    display: inline-block;
    background: rgba(255,87,34,.15);
    color: #FF7043;
    padding: 5px 8px;
    border-radius: 6px;
    font-weight: bold;
    white-space: nowrap;
}

.description {
    max-width: 230px;
    color: #b8bec8;
    line-height: 1.5;
}

.address {
    max-width: 250px;
    color: #b8bec8;
}

/* =========================
   STATUS
========================= */

.status {
    display: inline-block;
    padding: 6px 9px;
    border-radius: 20px;
    font-size: 12px;
    font-weight: bold;
    white-space: nowrap;
}

.status-menunggu {
    background: #493b17;
    color: #ffc107;
}

.status-diproses {
    background: #153c50;
    color: #29b6f6;
}

.status-selesai {
    background: #163d25;
    color: #4caf50;
}

.status-diambil {
    background: #33204a;
    color: #ce93d8;
}

.status-batal {
    background: #4a1d1d;
    color: #ff6b6b;
}

/* =========================
   ACTION
========================= */

.actions {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
}

.action-btn {
    border: none;
    padding: 7px 9px;
    border-radius: 6px;
    cursor: pointer;
    color: white;
    font-size: 12px;
    font-weight: bold;
}

.price-btn {
    background: #6c5ce7;
}

.status-btn {
    background: #1976d2;
}

.wa-btn {
    background: #20a464;
}

.map-btn {
    background: #455a64;
}

.note-btn {
    background: #FF5722;
}

/* =========================
   MODAL
========================= */

.modal {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,.75);
    z-index: 1000;
    align-items: center;
    justify-content: center;
    padding: 20px;
}

.modal-box {
    background: #181b22;
    width: 100%;
    max-width: 450px;
    border-radius: 15px;
    border: 1px solid #30343d;
    padding: 25px;
}

.modal-box h2 {
    margin-top: 0;
}

.modal-buttons {
    display: flex;
    gap: 10px;
}

.modal-buttons button {
    flex: 1;
}

.cancel-btn {
    background: #343943;
    color: white;
    border: none;
    padding: 12px;
    border-radius: 8px;
    cursor: pointer;
}

/* =========================
   DETAIL
========================= */

.detail-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
    margin-bottom: 15px;
}

.detail-item {
    background: #111318;
    padding: 10px;
    border-radius: 8px;
}

.detail-label {
    color: #858c98;
    font-size: 11px;
    margin-bottom: 4px;
}

.detail-value {
    color: white;
    font-weight: bold;
}

/* =========================
   MOBILE
========================= */

@media(max-width: 800px) {

    header {
        padding: 13px 15px;
    }

    .brand {
        font-size: 21px;
    }

    .container {
        padding: 15px;
    }

    .stats {
        grid-template-columns: 1fr 1fr;
    }

    .stat-number {
        font-size: 22px;
    }

    .toolbar {
        flex-direction: column;
    }

    .search,
    select.input {
        width: 100%;
        min-width: 0;
    }
}

@media(max-width: 500px) {

    .stats {
        grid-template-columns: 1fr 1fr;
    }

    .detail-grid {
        grid-template-columns: 1fr;
    }
}
</style>
</head>

<body>

<!-- =========================
     LOGIN PAGE
========================= -->

<div id="loginPage">

    <div class="login-box">

        <h1>
            <span class="gadget">Gadget</span><span class="care">Care</span>
        </h1>

        <p>Admin Panel</p>

        <input
            id="email"
            class="input"
            type="email"
            placeholder="Email admin"
        >

        <input
            id="password"
            class="input"
            type="password"
            placeholder="Password"
        >

        <button
            class="primary-btn"
            onclick="login()"
        >
            Login
        </button>

        <div id="loginAlert" class="alert"></div>

    </div>

</div>


<!-- =========================
     ADMIN PAGE
========================= -->

<div id="adminPage">

<header>

    <a href="./index.html" class="brand">
        <span class="gadget">Gadget</span><span class="care">Care</span>
    </a>

    <div class="header-right">

        <span id="adminEmail"></span>

        <button
            class="logout-btn"
            onclick="logout()"
        >
            Logout
        </button>

    </div>

</header>


<div class="container">

    <div class="page-title">

        <h1>Dashboard Service</h1>

        <p>
            Kelola semua data service GadgetCare
        </p>

    </div>


    <!-- STATISTICS -->

    <div class="stats">

        <div class="stat-card">
            <div class="stat-title">
                Total Booking
            </div>

            <div
                id="totalBooking"
                class="stat-number"
            >
                0
            </div>
        </div>


        <div class="stat-card">
            <div class="stat-title">
                Menunggu
            </div>

            <div
                id="waitingBooking"
                class="stat-number"
            >
                0
            </div>
        </div>


        <div class="stat-card">
            <div class="stat-title">
                Diproses
            </div>

            <div
                id="processBooking"
                class="stat-number"
            >
                0
            </div>
        </div>


        <div class="stat-card">
            <div class="stat-title">
                Selesai
            </div>

            <div
                id="doneBooking"
                class="stat-number"
            >
                0
            </div>
        </div>

    </div>


    <!-- SEARCH -->

    <div class="toolbar">

        <input
            id="searchInput"
            class="input search"
            placeholder="Cari nama, nomor HP, kode booking, device..."
            oninput="renderBookings()"
        >


        <select
            id="statusFilter"
            class="input"
            onchange="renderBookings()"
        >

            <option value="">
                Semua Status
            </option>

            <option value="Menunggu">
                Menunggu
            </option>

            <option value="Diproses">
                Diproses
            </option>

            <option value="Selesai">
                Selesai
            </option>

            <option value="Diambil">
                Diambil
            </option>

            <option value="Batal">
                Batal
            </option>

        </select>


        <button
            class="primary-btn"
            style="width:auto;padding:12px 20px;"
            onclick="loadBookings()"
        >
            Refresh
        </button>

    </div>


    <!-- TABLE -->

    <div class="table-container">

        <table>

            <thead>

                <tr>

                    <th>
                        Kode
                    </th>

                    <th>
                        Customer
                    </th>

                    <th>
                        WhatsApp
                    </th>

                    <th>
                        Merk / Device
                    </th>

                    <th>
                        Kode Kerusakan
                    </th>

                    <th>
                        Keterangan Kerusakan
                    </th>

                    <th>
                        Alamat
                    </th>

                    <th>
                        Harga
                    </th>

                    <th>
                        Status
                    </th>

                    <th>
                        Tanggal
                    </th>

                    <th>
                        Aksi
                    </th>

                </tr>

            </thead>

            <tbody id="bookingTable">

                <tr>
                    <td colspan="11" style="text-align:center;">
                        Memuat data...
                    </td>
                </tr>

            </tbody>

        </table>

    </div>

</div>

</div>


<!-- =========================
     PRICE MODAL
========================= -->

<div id="priceModal" class="modal">

    <div class="modal-box">

        <h2>
            Atur Harga Service
        </h2>

        <p id="priceCustomer"></p>

        <input
            id="priceInput"
            class="input"
            type="number"
            min="0"
            placeholder="Masukkan harga"
        >

        <div class="modal-buttons">

            <button
                class="cancel-btn"
                onclick="closePriceModal()"
            >
                Batal
            </button>

            <button
                class="primary-btn"
                onclick="savePrice()"
            >
                Simpan Harga
            </button>

        </div>

    </div>

</div>


<!-- =========================
     STATUS MODAL
========================= -->

<div id="statusModal" class="modal">

    <div class="modal-box">

        <h2>
            Update Status
        </h2>

        <p id="statusCustomer"></p>

        <select
            id="statusInput"
            class="input"
        >

            <option value="Menunggu">
                Menunggu
            </option>

            <option value="Diproses">
                Diproses
            </option>

            <option value="Selesai">
                Selesai
            </option>

            <option value="Diambil">
                Diambil
            </option>

            <option value="Batal">
                Batal
            </option>

        </select>


        <div class="modal-buttons">

            <button
                class="cancel-btn"
                onclick="closeStatusModal()"
            >
                Batal
            </button>

            <button
                class="primary-btn"
                onclick="saveStatus()"
            >
                Simpan Status
            </button>

        </div>

    </div>

</div>


<script>

/* =========================
   SUPABASE
========================= */

const SUPABASE_URL =
    "https://sqpolxwdyypbxylgvihi.supabase.co";

const SUPABASE_KEY =
    "sb_publishable_rtENTJcEofFn3NbyP76ORw_YY1CwF8G";

const supabaseClient =
    window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY
    );


/* =========================
   DATA
========================= */

let bookings = [];

let selectedBooking = null;


/* =========================
   LOGIN
========================= */

async function login() {

    const email =
        document.getElementById("email").value.trim();

    const password =
        document.getElementById("password").value;

    const alertBox =
        document.getElementById("loginAlert");

    alertBox.style.display = "none";

    if (!email || !password) {

        alertBox.textContent =
            "Email dan password wajib diisi.";

        alertBox.style.display = "block";

        return;
    }


    const {
        data,
        error
    } = await supabaseClient.auth.signInWithPassword({
        email,
        password
    });


    if (error) {

        alertBox.textContent =
            error.message;

        alertBox.style.display =
            "block";

        return;
    }


    showAdmin(data.user);

}


/* =========================
   SHOW ADMIN
========================= */

function showAdmin(user) {

    document.getElementById("loginPage")
        .style.display = "none";

    document.getElementById("adminPage")
        .style.display = "block";

    document.getElementById("adminEmail")
        .textContent = user.email || "";

    loadBookings();

}


/* =========================
   LOGOUT
========================= */

async function logout() {

    await supabaseClient.auth.signOut();

    location.reload();

}


/* =========================
   CHECK SESSION
========================= */

async function checkSession() {

    const {
        data
    } = await supabaseClient.auth.getSession();

    if (data.session) {

        showAdmin(data.session.user);

    }

}


/* =========================
   LOAD BOOKINGS
========================= */

async function loadBookings() {

    const table =
        document.getElementById("bookingTable");

    table.innerHTML = `
        <tr>
            <td colspan="11" style="text-align:center;">
                Memuat data...
            </td>
        </tr>
    `;


    const {
        data,
        error
    } = await supabaseClient
        .from("bookings")
        .select("*")
        .order("created_at", {
            ascending: false
        });


    if (error) {

        console.error(error);

        table.innerHTML = `
            <tr>
                <td colspan="11" style="text-align:center;color:#ff6b6b;">
                    ${escapeHtml(error.message)}
                </td>
            </tr>
        `;

        return;
    }


    bookings = data || [];

    updateStatistics();

    renderBookings();

}


/* =========================
   STATISTICS
========================= */

function updateStatistics() {

    document.getElementById("totalBooking")
        .textContent = bookings.length;


    document.getElementById("waitingBooking")
        .textContent =
        bookings.filter(
            x => x.status === "Menunggu"
        ).length;


    document.getElementById("processBooking")
        .textContent =
        bookings.filter(
            x => x.status === "Diproses"
        ).length;


    document.getElementById("doneBooking")
        .textContent =
        bookings.filter(
            x => x.status === "Selesai"
        ).length;

}


/* =========================
   RENDER
========================= */

function renderBookings() {

    const table =
        document.getElementById("bookingTable");

    const search =
        document.getElementById("searchInput")
            .value
            .toLowerCase()
            .trim();

    const filter =
        document.getElementById("statusFilter")
            .value;


    const filtered =
        bookings.filter(item => {

            const text = [

                item.booking_code,

                item.customer_name,

                item.phone,

                item.device,

                item.damage,

                item.description,

                item.address

            ]
            .filter(Boolean)
            .join(" ")
            .toLowerCase();


            const searchMatch =
                !search ||
                text.includes(search);


            const statusMatch =
                !filter ||
                item.status === filter;


            return searchMatch &&
                   statusMatch;

        });


    if (!filtered.length) {

        table.innerHTML = `
            <tr>
                <td
                    colspan="11"
                    style="text-align:center;padding:30px;color:#858c98;"
                >
                    Tidak ada booking ditemukan.
                </td>
            </tr>
        `;

        return;
    }


    table.innerHTML =
        filtered.map(item => {

            const price =
                Number(item.total_price || 0)
                .toLocaleString("id-ID");


            const date =
                item.created_at
                ? new Date(item.created_at)
                    .toLocaleString("id-ID")
                : "-";


            const statusClass =
                getStatusClass(item.status);


            return `

            <tr>

                <!-- KODE -->

                <td>

                    <strong>
                        ${escapeHtml(
                            item.booking_code || "-"
                        )}
                    </strong>

                </td>


                <!-- CUSTOMER -->

                <td>

                    <strong>
                        ${escapeHtml(
                            item.customer_name || "-"
                        )}
                    </strong>

                </td>


                <!-- WHATSAPP -->

                <td>

                    ${escapeHtml(
                        item.phone || "-"
                    )}

                </td>


                <!-- DEVICE / MERK -->

                <td>

                    <div class="device">

                        ${escapeHtml(
                            item.device || "-"
                        )}

                    </div>

                </td>


                <!-- KODE KERUSAKAN -->

                <td>

                    <span class="damage">

                        ${escapeHtml(
                            item.damage || "-"
                        )}

                    </span>

                </td>


                <!-- KETERANGAN -->

                <td>

                    <div class="description">

                        ${escapeHtml(
                            item.description || "-"
                        )}

                    </div>

                </td>


                <!-- ALAMAT -->

                <td>

                    <div class="address">

                        ${escapeHtml(
                            item.address || "-"
                        )}

                    </div>

                </td>


                <!-- HARGA -->

                <td>

                    <strong>
                        Rp ${price}
                    </strong>

                </td>


                <!-- STATUS -->

                <td>

                    <span class="status ${statusClass}">

                        ${escapeHtml(
                            item.status || "Menunggu"
                        )}

                    </span>

                </td>


                <!-- TANGGAL -->

                <td>

                    ${date}

                </td>


                <!-- ACTION -->

                <td>

                    <div class="actions">

                        <button
                            class="action-btn price-btn"
                            onclick="openPriceModal('${item.id}')"
                        >
                            Harga
                        </button>


                        <button
                            class="action-btn status-btn"
                            onclick="openStatusModal('${item.id}')"
                        >
                            Status
                        </button>


                        <button
                            class="action-btn wa-btn"
                            onclick="openWhatsApp('${item.id}')"
                        >
                            WA
                        </button>


                        <button
                            class="action-btn map-btn"
                            onclick="openMaps('${item.id}')"
                        >
                            Maps
                        </button>


                        <button
                            class="action-btn note-btn"
                            onclick="openNota('${item.booking_code}')"
                        >
                            Nota
                        </button>

                    </div>

                </td>

            </tr>

            `;

        }).join("");

}


/* =========================
   STATUS CLASS
========================= */

function getStatusClass(status) {

    switch (status) {

        case "Diproses":
            return "status-diproses";

        case "Selesai":
            return "status-selesai";

        case "Diambil":
            return "status-diambil";

        case "Batal":
            return "status-batal";

        default:
            return "status-menunggu";

    }

}


/* =========================
   PRICE
========================= */

function openPriceModal(id) {

    selectedBooking =
        bookings.find(
            x => x.id === id
        );


    if (!selectedBooking) return;


    document.getElementById("priceCustomer")
        .textContent =
        `${selectedBooking.customer_name} — ${selectedBooking.device}`;


    document.getElementById("priceInput")
        .value =
        selectedBooking.total_price || "";


    document.getElementById("priceModal")
        .style.display = "flex";

}


function closePriceModal() {

    document.getElementById("priceModal")
        .style.display = "none";

    selectedBooking = null;

}


async function savePrice() {

    if (!selectedBooking) return;


    const price =
        Number(
            document.getElementById("priceInput")
                .value
        );


    if (isNaN(price) || price < 0) {

        alert("Harga tidak valid.");

        return;

    }


    const {
        data,
        error
    } = await supabaseClient.rpc(
        "update_booking_price",
        {
            p_booking_id:
                selectedBooking.id,

            p_price:
                price
        }
    );


    if (error) {

        console.error(error);

        alert(
            "Gagal mengubah harga:\n" +
            error.message
        );

        return;
    }


    closePriceModal();

    await loadBookings();

    alert("Harga berhasil diperbarui.");

}


/* =========================
   STATUS
========================= */

function openStatusModal(id) {

    selectedBooking =
        bookings.find(
            x => x.id === id
        );


    if (!selectedBooking) return;


    document.getElementById("statusCustomer")
        .textContent =
        `${selectedBooking.customer_name} — ${selectedBooking.device}`;


    document.getElementById("statusInput")
        .value =
        selectedBooking.status || "Menunggu";


    document.getElementById("statusModal")
        .style.display = "flex";

}


function closeStatusModal() {

    document.getElementById("statusModal")
        .style.display = "none";

    selectedBooking = null;

}


async function saveStatus() {

    if (!selectedBooking) return;


    const status =
        document.getElementById("statusInput")
            .value;


    const {
        error
    } = await supabaseClient
        .from("bookings")
        .update({
            status: status
        })
        .eq("id", selectedBooking.id);


    if (error) {

        console.error(error);

        alert(
            "Gagal mengubah status:\n" +
            error.message
        );

        return;
    }


    closeStatusModal();

    await loadBookings();

    alert("Status berhasil diperbarui.");

}


/* =========================
   WHATSAPP
========================= */

function openWhatsApp(id) {

    const item =
        bookings.find(
            x => x.id === id
        );


    if (!item || !item.phone) {

        alert("Nomor WhatsApp tidak tersedia.");

        return;

    }


    let phone =
        item.phone.replace(/\D/g, "");


    if (phone.startsWith("0")) {

        phone =
            "62" + phone.substring(1);

    }


    const message =
`Halo ${item.customer_name},

Kami dari GadgetCare.

Update service HP Anda:

Kode Booking: ${item.booking_code}
Device: ${item.device}
Kerusakan: ${item.damage}
Status: ${item.status}
Total Harga: Rp ${Number(item.total_price || 0).toLocaleString("id-ID")}

Terima kasih.`;


    window.open(
        "https://wa.me/" +
        phone +
        "?text=" +
        encodeURIComponent(message),
        "_blank"
    );

}


/* =========================
   GOOGLE MAPS
========================= */

function openMaps(id) {

    const item =
        bookings.find(
            x => x.id === id
        );


    if (!item) return;


    if (
        item.latitude !== null &&
        item.longitude !== null &&
        item.latitude !== undefined &&
        item.longitude !== undefined
    ) {

        window.open(
            `https://www.google.com/maps?q=${item.latitude},${item.longitude}`,
            "_blank"
        );

        return;

    }


    if (item.address) {

        window.open(
            "https://www.google.com/maps/search/?api=1&query=" +
            encodeURIComponent(item.address),
            "_blank"
        );

        return;

    }


    alert("Lokasi tidak tersedia.");

}


/* =========================
   NOTA
========================= */

function openNota(code) {

    if (!code) {

        alert("Kode booking tidak tersedia.");

        return;

    }


    window.open(
        "./nota.html?code=" +
        encodeURIComponent(code),
        "_blank"
    );

}


/* =========================
   ESCAPE HTML
========================= */

function escapeHtml(value) {

    if (value === null ||
        value === undefined) {

        return "";

    }


    return String(value)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");

}


/* =========================
   CLOSE MODAL CLICK OUTSIDE
========================= */

window.addEventListener(
    "click",
    function(event) {

        const priceModal =
            document.getElementById("priceModal");

        const statusModal =
            document.getElementById("statusModal");


        if (event.target === priceModal) {

            closePriceModal();

        }


        if (event.target === statusModal) {

            closeStatusModal();

        }

    }
);

checkSession();

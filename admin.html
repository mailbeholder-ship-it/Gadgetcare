<!DOCTYPE html>
<html lang="id">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>
    Admin - Home Service Cell
  </title>

  <!-- SUPABASE -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>


  <style>

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }


    body {
      background: #0b1117;
      color: white;
      padding: 20px;
    }


    .container {
      max-width: 1100px;
      margin: auto;
    }


    h1 {
      margin-bottom: 5px;
    }


    .subtitle {
      color: #8c9aa8;
      margin-bottom: 25px;
    }


    .login-box {
      background: #111a22;
      border: 1px solid #24313d;
      border-radius: 15px;
      padding: 25px;
      max-width: 500px;
      margin: 40px auto;
    }


    input,
    button,
    select {

      width: 100%;

      padding: 13px;

      margin-top: 10px;

      border-radius: 8px;

      border: 1px solid #334454;

      background: #18232d;

      color: white;

      font-size: 15px;

    }


    button {

      background: #00c8ff;

      color: #001018;

      border: none;

      font-weight: bold;

      cursor: pointer;

    }


    button:hover {
      opacity: .9;
    }


    .logout {

      width: auto;

      background: #ef4444;

      color: white;

      float: right;

      padding: 10px 18px;

    }


    .stats {

      display: grid;

      grid-template-columns:
        repeat(3, 1fr);

      gap: 15px;

      margin: 20px 0;

    }


    .stat {

      background: #16212b;

      border: 1px solid #293947;

      border-radius: 12px;

      padding: 20px;

    }


    .stat-number {

      font-size: 30px;

      font-weight: bold;

      margin-top: 8px;

      color: #00c8ff;

    }


    .booking {

      background: #16212b;

      border: 1px solid #293947;

      border-radius: 12px;

      padding: 18px;

      margin-top: 15px;

    }


    .booking-code {

      color: #00c8ff;

      font-size: 19px;

      font-weight: bold;

    }


    .info {

      margin-top: 12px;

      line-height: 1.8;

      color: #d5dde5;

    }


    .divider {

      height: 1px;

      background: #293947;

      margin: 15px 0;

    }


    .location-box {

      margin-top: 12px;

      padding: 12px;

      background: #101920;

      border-radius: 10px;

      border: 1px solid #293947;

    }


    .coordinates {

      color: #8fdcff;

      font-size: 14px;

      margin-bottom: 8px;

    }


    .map-button {

      display: inline-block;

      margin-top: 5px;

      padding: 10px 14px;

      background: #00c8ff;

      color: #001018;

      text-decoration: none;

      border-radius: 8px;

      font-weight: bold;

    }


    .price-box {

      margin-top: 15px;

      padding: 15px;

      background: #101920;

      border: 1px solid #293947;

      border-radius: 10px;

    }


    .price-input {

      font-size: 17px;

      margin-top: 8px;

    }


    .price-button {

      background: #22c55e;

      color: white;

      margin-top: 8px;

    }


    .current-price {

      color: #22c55e;

      font-size: 20px;

      font-weight: bold;

      margin-top: 5px;

    }


    .status {

      margin-top: 15px;

    }


    .refresh {

      background: #263746;

      color: white;

      margin-bottom: 15px;

    }


    .hidden {
      display: none;
    }


    .message {

      margin-top: 12px;

      color: #ff8585;

    }


    .success-message {

      color: #22c55e;

    }


    @media(max-width:700px) {

      body {
        padding: 12px;
      }


      .stats {

        grid-template-columns: 1fr;

      }


      .logout {

        float: none;

        width: 100%;

        margin-bottom: 20px;

      }

    }

  </style>

</head>


<body>


<div class="container">


  <!-- ================================= -->
  <!-- LOGIN -->
  <!-- ================================= -->

  <div id="loginSection">

    <div class="login-box">

      <h1>
        🔐 Admin Login
      </h1>

      <p class="subtitle">
        Home Service Cell
      </p>


      <input
        type="email"
        id="email"
        placeholder="Email admin"
        autocomplete="username"
      >


      <input
        type="password"
        id="password"
        placeholder="Password"
        autocomplete="current-password"
      >


      <button onclick="login()">
        LOGIN
      </button>


      <div
        id="loginMessage"
        class="message"
      ></div>

    </div>

  </div>


  <!-- ================================= -->
  <!-- DASHBOARD -->
  <!-- ================================= -->

  <div
    id="dashboardSection"
    class="hidden"
  >


    <button
      class="logout"
      onclick="logout()"
    >
      Logout
    </button>


    <h1>
      📱 Home Service Cell
    </h1>


    <p class="subtitle">
      Admin Dashboard
    </p>


    <!-- STATISTIK -->

    <div class="stats">


      <div class="stat">

        📋 Total Booking

        <div
          class="stat-number"
          id="totalBooking"
        >
          0
        </div>

      </div>


      <div class="stat">

        🔧 Sedang Diproses

        <div
          class="stat-number"
          id="processingBooking"
        >
          0
        </div>

      </div>


      <div class="stat">

        ✅ Selesai

        <div
          class="stat-number"
          id="completedBooking"
        >
          0
        </div>

      </div>


    </div>


    <!-- REFRESH -->

    <button
      class="refresh"
      onclick="loadBookings()"
    >
      🔄 Refresh Booking
    </button>


    <!-- LIST -->

    <div id="bookingList">

      <div class="booking">
        Memuat booking...
      </div>

    </div>


  </div>


</div>


<script>


/* =====================================
   SUPABASE
===================================== */

const SUPABASE_URL =
  "https://sqpolxwdyypbxylgvihi.supabase.co";


const SUPABASE_KEY =
  "sb_publishable_rtENTJcEofFn3NbyP76ORw_YY1CwF8G";


const supabaseClient =
  window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
  );


/* =====================================
   FORMAT RUPIAH
===================================== */

function formatRupiah(value) {

  const number =
    Number(value || 0);

  return number.toLocaleString(
    "id-ID",
    {
      style: "currency",
      currency: "IDR",
      minimumFractionDigits: 0
    }
  );

}


/* =====================================
   LOGIN
===================================== */

async function login() {

  const email =
    document
      .getElementById("email")
      .value
      .trim();


  const password =
    document
      .getElementById("password")
      .value;


  const message =
    document
      .getElementById("loginMessage");


  if (!email || !password) {

    message.textContent =
      "Email dan password wajib diisi.";

    return;
  }


  message.textContent =
    "Memproses login...";


  const { error } =
    await supabaseClient.auth
      .signInWithPassword({

        email: email,

        password: password

      });


  if (error) {

    console.error(error);

    message.textContent =
      "Login gagal: " +
      error.message;

    return;
  }


  message.textContent = "";


  showDashboard();

}


/* =====================================
   SESSION
===================================== */

async function checkSession() {

  const { data } =
    await supabaseClient.auth
      .getSession();


  if (data.session) {

    showDashboard();

  }

}


/* =====================================
   SHOW DASHBOARD
===================================== */

function showDashboard() {

  document
    .getElementById("loginSection")
    .classList
    .add("hidden");


  document
    .getElementById("dashboardSection")
    .classList
    .remove("hidden");


  loadBookings();

}


/* =====================================
   LOGOUT
===================================== */

async function logout() {

  await supabaseClient.auth.signOut();

  location.reload();

}


/* =====================================
   LOAD BOOKING
===================================== */

async function loadBookings() {

  const list =
    document
      .getElementById("bookingList");


  list.innerHTML =
    `<div class="booking">
      ⏳ Memuat booking...
    </div>`;


  const { data, error } =
    await supabaseClient
      .from("bookings")
      .select("*")
      .order(
        "created_at",
        {
          ascending: false
        }
      );


  if (error) {

    console.error(error);


    list.innerHTML =
      `<div class="booking">

        ❌ Gagal mengambil booking.

        <br><br>

        ${error.message}

      </div>`;

    return;
  }


  /* =====================================
     STATISTIK
  ===================================== */

  document
    .getElementById("totalBooking")
    .textContent =
      data.length;


  document
    .getElementById("processingBooking")
    .textContent =
      data.filter(item =>

        item.status !== "Menunggu" &&
        item.status !== "Selesai"

      ).length;


  document
    .getElementById("completedBooking")
    .textContent =
      data.filter(item =>

        item.status === "Selesai"

      ).length;


  /* =====================================
     EMPTY
  ===================================== */

  if (!data.length) {

    list.innerHTML =
      `<div class="booking">

        Belum ada booking masuk.

      </div>`;

    return;
  }


  list.innerHTML = "";


  /* =====================================
     LOOP BOOKING
  ===================================== */

  data.forEach(item => {


    const date =
      new Date(
        item.created_at
      ).toLocaleString(
        "id-ID"
      );


    const booking =
      document.createElement(
        "div"
      );


    booking.className =
      "booking";


    /* =================================
       LOKASI
    ================================= */

    let locationHTML = "";


    if (

      item.latitude !== null &&
      item.latitude !== undefined &&

      item.longitude !== null &&
      item.longitude !== undefined

    ) {


      const latitude =
        Number(
          item.latitude
        ).toFixed(6);


      const longitude =
        Number(
          item.longitude
        ).toFixed(6);


      locationHTML = `

        <div class="location-box">

          <div class="coordinates">

            📌 <b>Koordinat</b>

            <br>

            ${latitude},
            ${longitude}

          </div>


          <a

            class="map-button"

            href="https://www.google.com/maps?q=${item.latitude},${item.longitude}"

            target="_blank"

            rel="noopener noreferrer"

          >

            🗺️ Lihat Lokasi di Google Maps

          </a>

        </div>

      `;

    } else {


      locationHTML = `

        <div class="location-box">

          📌

          <span class="message">

            Koordinat belum tersedia

          </span>

        </div>

      `;

    }


    /* =================================
       HARGA
    ================================= */

    const currentPrice =
      Number(
        item.total_price || 0
      );


    /* =================================
       BOOKING HTML
    ================================= */

    booking.innerHTML = `


      <div class="booking-code">

        🎫 ${item.booking_code}

      </div>


      <div class="info">


        👤 <b>Nama:</b>

        ${item.customer_name}

        <br>


        📱 <b>No. HP:</b>

        ${item.phone}

        <br>


        📱 <b>Perangkat:</b>

        ${item.device}

        <br>


        🔧 <b>Kerusakan:</b>

        ${item.damage}

        <br>


        📝 <b>Keterangan:</b>

        ${item.description || "-"}

        <br>


        📍 <b>Alamat:</b>

        ${item.address}


        ${locationHTML}


        <div class="divider"></div>


        <!-- HARGA -->

        <div class="price-box">

          💰 <b>Total Harga</b>


          <div class="current-price">

            ${formatRupiah(currentPrice)}

          </div>


          <input

            class="price-input"

            type="number"

            min="0"

            id="price-${item.id}"

            value="${currentPrice}"

            placeholder="Masukkan total harga"

          >


          <button

            class="price-button"

            onclick="updatePrice('${item.id}')"

          >

            💾 Simpan Harga

          </button>

        </div>


        <div class="divider"></div>


        🕐 <b>Masuk:</b>

        ${date}


      </div>


      <!-- STATUS -->

      <div class="status">


        <select

          onchange="updateStatus(
            '${item.id}',
            this.value
          )"

        >


          <option

            value="Menunggu"

            ${
              item.status === "Menunggu"
              ? "selected"
              : ""
            }

          >

            Menunggu

          </option>


          <option

            value="Dikonfirmasi"

            ${
              item.status === "Dikonfirmasi"
              ? "selected"
              : ""
            }

          >

            Dikonfirmasi

          </option>


          <option

            value="Teknisi Berangkat"

            ${
              item.status === "Teknisi Berangkat"
              ? "selected"
              : ""
            }

          >

            Teknisi Berangkat

          </option>


          <option

            value="Sedang Diperbaiki"

            ${
              item.status === "Sedang Diperbaiki"
              ? "selected"
              : ""
            }

          >

            Sedang Diperbaiki

          </option>


          <option

            value="Selesai"

            ${
              item.status === "Selesai"
              ? "selected"
              : ""
            }

          >

            Selesai

          </option>


        </select>


      </div>


    `;


    list.appendChild(
      booking
    );

  });

}


/* =====================================
   UPDATE STATUS
===================================== */

async function updateStatus(
  id,
  status
) {


  const { error } =
    await supabaseClient
      .from("bookings")
      .update({

        status: status

      })
      .eq(
        "id",
        id
      );


  if (error) {

    alert(
      "❌ Gagal mengubah status:\n" +
      error.message
    );

    return;
  }


  await loadBookings();

}


/* =====================================
   UPDATE PRICE
===================================== */

async function updatePrice(id) {


  const input =
    document.getElementById(
      "price-" + id
    );


  if (!input) {

    alert(
      "Input harga tidak ditemukan."
    );

    return;
  }


  const price =
    Number(
      input.value
    );


  if (
    !Number.isFinite(price) ||
    price < 0
  ) {

    alert(
      "❌ Masukkan harga yang valid."
    );

    return;
  }


  const { error } =
    await supabaseClient
      .from("bookings")
      .update({

        total_price:
          Math.round(price)

      })
      .eq(
        "id",
        id
      );


  if (error) {

    console.error(error);


    alert(
      "❌ Gagal menyimpan harga:\n" +
      error.message
    );

    return;
  }


  alert(
    "✅ Total harga berhasil disimpan:\n" +
    formatRupiah(price)
  );


  await loadBookings();

}


/* =====================================
   START
===================================== */

checkSession();


</script>


</body>

</html>

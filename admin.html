<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GadgetCare - Admin</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{box-sizing:border-box}

body{
  margin:0;
  font-family:Arial,Helvetica,sans-serif;
  background:#0d0f13;
  color:#fff;
}

.header{
  height:70px;
  background:#15181e;
  border-bottom:1px solid #292d35;
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:0 25px;
  position:sticky;
  top:0;
  z-index:100;
}

.brand{
  text-decoration:none;
  font-size:25px;
  font-weight:800;
}

.gadget{color:#fff}
.care{color:#FF5722}

.logout{
  border:0;
  background:#e53935;
  color:#fff;
  padding:10px 16px;
  border-radius:8px;
  cursor:pointer;
  font-weight:bold;
}

.container{
  max-width:1450px;
  margin:auto;
  padding:25px;
}

.page-title{
  margin:0 0 5px;
  font-size:28px;
}

.page-subtitle{
  color:#888;
  margin-bottom:25px;
}

.login-box{
  max-width:420px;
  margin:80px auto;
  background:#15181e;
  border:1px solid #292d35;
  border-radius:16px;
  padding:30px;
}

.login-box h2{
  text-align:center;
  margin-top:0;
}

label{
  display:block;
  color:#bbb;
  font-size:14px;
  margin-bottom:6px;
}

input,
select,
textarea{
  width:100%;
  padding:12px;
  border:1px solid #353a44;
  border-radius:8px;
  background:#0d0f13;
  color:#fff;
  outline:none;
  font-family:inherit;
}

input:focus,
select:focus,
textarea:focus{
  border-color:#FF5722;
}

textarea{
  resize:vertical;
  min-height:120px;
}

.form-group{
  margin-bottom:16px;
}

.primary{
  width:100%;
  border:0;
  padding:13px;
  border-radius:8px;
  background:#FF5722;
  color:#fff;
  font-weight:bold;
  cursor:pointer;
}

.primary:hover{
  background:#f4511e;
}

.message{
  text-align:center;
  margin-top:12px;
  color:#ff7777;
}

.stats{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:15px;
  margin-bottom:20px;
}

.stat{
  background:#15181e;
  border:1px solid #292d35;
  border-radius:12px;
  padding:20px;
}

.stat-title{
  color:#888;
  font-size:13px;
}

.stat-number{
  display:block;
  font-size:28px;
  font-weight:bold;
  margin-top:8px;
}

.toolbar{
  display:flex;
  gap:10px;
  margin-bottom:20px;
}

.toolbar input{
  flex:1;
}

.toolbar select{
  width:200px;
}

.refresh{
  border:0;
  background:#343942;
  color:#fff;
  padding:12px 16px;
  border-radius:8px;
  cursor:pointer;
}

.table-wrapper{
  overflow-x:auto;
  background:#15181e;
  border:1px solid #292d35;
  border-radius:12px;
}

table{
  width:100%;
  min-width:1250px;
  border-collapse:collapse;
}

th,
td{
  padding:13px;
  border-bottom:1px solid #292d35;
  text-align:left;
  vertical-align:top;
}

th{
  background:#20242b;
  color:#ff7043;
  font-size:13px;
}

td{
  font-size:13px;
}

tr:hover{
  background:#1b1e24;
}

.code{
  color:#FF5722;
  font-weight:bold;
  white-space:nowrap;
}

.description{
  max-width:240px;
  color:#bbb;
  line-height:1.5;
}

.status{
  display:inline-block;
  padding:6px 10px;
  border-radius:20px;
  font-size:11px;
  font-weight:bold;
  white-space:nowrap;
}

.status-menunggu{
  color:#ffc107;
  background:#493b14;
}

.status-diproses{
  color:#42a5f5;
  background:#153b56;
}

.status-selesai{
  color:#4caf50;
  background:#163d28;
}

.status-diambil{
  color:#ce93d8;
  background:#3c2551;
}

.status-batal{
  color:#ff7070;
  background:#4a2020;
}

.actions{
  display:flex;
  flex-wrap:wrap;
  gap:5px;
  min-width:210px;
}

.action{
  border:0;
  color:#fff;
  padding:7px 9px;
  border-radius:6px;
  cursor:pointer;
  font-size:11px;
  font-weight:bold;
}

.detail-btn{background:#607d8b}
.price-btn{background:#FF5722}
.status-btn{background:#536dfe}
.wa-btn{background:#25d366}
.map-btn{background:#4285f4}
.nota-btn{background:#8e44ad}

.empty{
  text-align:center;
  color:#777;
  padding:40px;
}

.modal{
  display:none;
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.78);
  z-index:1000;
  align-items:center;
  justify-content:center;
  padding:20px;
}

.modal-box{
  width:100%;
  max-width:600px;
  max-height:90vh;
  overflow-y:auto;
  background:#15181e;
  border:1px solid #343942;
  border-radius:16px;
  padding:25px;
}

.modal-title{
  margin-top:0;
  margin-bottom:5px;
}

.modal-code{
  color:#FF5722;
  font-weight:bold;
  margin-bottom:20px;
}

.detail-grid{
  display:grid;
  grid-template-columns:150px 1fr;
  gap:10px;
  margin-bottom:20px;
}

.detail-label{
  color:#888;
}

.detail-value{
  font-weight:600;
  word-break:break-word;
}

.modal-actions{
  display:flex;
  gap:10px;
  margin-top:20px;
}

.modal-actions button{
  flex:1;
  padding:12px;
  border:0;
  border-radius:8px;
  color:#fff;
  font-weight:bold;
  cursor:pointer;
}

.cancel-btn{
  background:#343942;
}

.save-btn{
  background:#FF5722;
}

.loading{
  text-align:center;
  color:#888;
  padding:30px;
}

@media(max-width:900px){
  .stats{
    grid-template-columns:repeat(2,1fr);
  }

  .toolbar{
    flex-direction:column;
  }

  .toolbar select{
    width:100%;
  }
}

@media(max-width:600px){
  .header{
    padding:0 15px;
  }

  .container{
    padding:15px;
  }

  .stats{
    grid-template-columns:1fr 1fr;
  }

  .login-box{
    margin:40px 15px;
  }

  .detail-grid{
    grid-template-columns:110px 1fr;
  }
}
</style>
</head>

<body>

<header class="header">

  <a href="./index.html" class="brand">
    <span class="gadget">Gadget</span><span class="care">Care</span>
  </a>

  <button class="logout" onclick="logout()">
    Keluar
  </button>

</header>


<!-- LOGIN -->

<section id="loginSection">

  <div class="login-box">

    <h2>Admin GadgetCare</h2>

    <div class="form-group">
      <label>Email</label>
      <input
        type="email"
        id="email"
        placeholder="Email admin"
      >
    </div>

    <div class="form-group">
      <label>Password</label>
      <input
        type="password"
        id="password"
        placeholder="Password"
      >
    </div>

    <button class="primary" onclick="login()">
      Login Admin
    </button>

    <div id="loginMessage" class="message"></div>

  </div>

</section>


<!-- ADMIN -->

<section id="adminSection" style="display:none">

  <div class="container">

    <h1 class="page-title">
      Dashboard Admin
    </h1>

    <div class="page-subtitle">
      Kelola booking service GadgetCare
    </div>


    <!-- STATS -->

    <div class="stats">

      <div class="stat">
        <span class="stat-title">
          Total Booking
        </span>
        <strong
          class="stat-number"
          id="totalBooking"
        >0</strong>
      </div>

      <div class="stat">
        <span class="stat-title">
          Menunggu
        </span>
        <strong
          class="stat-number"
          id="waitingBooking"
        >0</strong>
      </div>

      <div class="stat">
        <span class="stat-title">
          Diproses
        </span>
        <strong
          class="stat-number"
          id="processBooking"
        >0</strong>
      </div>

      <div class="stat">
        <span class="stat-title">
          Selesai
        </span>
        <strong
          class="stat-number"
          id="doneBooking"
        >0</strong>
      </div>

    </div>


    <!-- TOOLBAR -->

    <div class="toolbar">

      <input
        id="searchInput"
        type="text"
        placeholder="Cari kode, nama, nomor HP, perangkat..."
        oninput="filterBookings()"
      >

      <select
        id="statusFilter"
        onchange="filterBookings()"
      >
        <option value="">Semua Status</option>
        <option value="Menunggu">Menunggu</option>
        <option value="Diproses">Diproses</option>
        <option value="Selesai">Selesai</option>
        <option value="Sudah Diambil">Sudah Diambil</option>
        <option value="Dibatalkan">Dibatalkan</option>
      </select>

      <button
        class="refresh"
        onclick="loadBookings()"
      >
        🔄 Refresh
      </button>

    </div>


    <!-- TABLE -->

    <div class="table-wrapper">

      <table>

        <thead>

          <tr>
            <th>Kode</th>
            <th>Pelanggan</th>
            <th>No. HP</th>
            <th>Perangkat</th>
            <th>Kerusakan</th>
            <th>Keterangan Kerusakan</th>
            <th>Alamat</th>
            <th>Status</th>
            <th>Total</th>
            <th>Tanggal</th>
            <th>Aksi</th>
          </tr>

        </thead>

        <tbody id="bookingTable">

          <tr>
            <td colspan="11" class="loading">
              Memuat data...
            </td>
          </tr>

        </tbody>

      </table>

    </div>

  </div>

</section>


<!-- DETAIL / EDIT MODAL -->

<div
  id="detailModal"
  class="modal"
>

  <div class="modal-box">

    <h2 class="modal-title">
      Detail Service
    </h2>

    <div
      id="detailBookingCode"
      class="modal-code"
    ></div>


    <div
      id="detailData"
      class="detail-grid"
    ></div>


    <div class="form-group">

      <label>
        Keterangan Kerusakan
      </label>

      <textarea
        id="descriptionInput"
        placeholder="Masukkan hasil pengecekan atau keterangan kerusakan..."
      ></textarea>

    </div>


    <div class="form-group">

      <label>
        Harga Service
      </label>

      <input
        type="number"
        id="priceInput"
        min="0"
        placeholder="Contoh: 150000"
      >

    </div>


    <div class="form-group">

      <label>
        Status Service
      </label>

      <select id="statusInput">

        <option value="Menunggu">
          Menunggu
        </option>

        <option value="Diproses">
          Diproses
        </option>

        <option value="Selesai">
          Selesai
        </option>

        <option value="Sudah Diambil">
          Sudah Diambil
        </option>

        <option value="Dibatalkan">
          Dibatalkan
        </option>

      </select>

    </div>


    <div class="modal-actions">

      <button
        class="cancel-btn"
        onclick="closeDetailModal()"
      >
        Batal
      </button>

      <button
        class="save-btn"
        onclick="saveDetail()"
      >
        💾 Simpan Perubahan
      </button>

    </div>

  </div>

</div>


<script>

const SUPABASE_URL =
  "https://sqpolxwdyypbxylgvihi.supabase.co";

const SUPABASE_KEY =
  "sb_publishable_rtENTJcEofFn3NbyP76ORw_YY1CwF8G";

const supabaseClient =
  supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
  );


let bookings = [];
let selectedBooking = null;


/* =========================
   LOGIN
========================= */

async function login(){

  const email =
    document.getElementById("email")
      .value
      .trim();

  const password =
    document.getElementById("password")
      .value;

  const message =
    document.getElementById("loginMessage");

  message.textContent = "";

  if(!email || !password){

    message.textContent =
      "Email dan password wajib diisi.";

    return;
  }

  const {error} =
    await supabaseClient.auth
      .signInWithPassword({
        email,
        password
      });

  if(error){

    console.error(error);

    message.textContent =
      "Login gagal: " + error.message;

    return;
  }

  showAdmin();

}


/* =========================
   SESSION
========================= */

async function checkSession(){

  const {data} =
    await supabaseClient.auth
      .getSession();

  if(data.session){

    showAdmin();

  }else{

    document.getElementById(
      "loginSection"
    ).style.display = "block";

    document.getElementById(
      "adminSection"
    ).style.display = "none";

  }

}


function showAdmin(){

  document.getElementById(
    "loginSection"
  ).style.display = "none";

  document.getElementById(
    "adminSection"
  ).style.display = "block";

  loadBookings();

}


/* =========================
   LOGOUT
========================= */

async function logout(){

  await supabaseClient.auth.signOut();

  location.reload();

}


/* =========================
   LOAD BOOKINGS
========================= */

async function loadBookings(){

  const tbody =
    document.getElementById(
      "bookingTable"
    );

  tbody.innerHTML = `
    <tr>
      <td colspan="11" class="loading">
        Memuat data booking...
      </td>
    </tr>
  `;


  const {data,error} =
    await supabaseClient
      .from("bookings")
      .select("*")
      .order(
        "created_at",
        {
          ascending:false
        }
      );


  if(error){

    console.error(error);

    tbody.innerHTML = `
      <tr>
        <td colspan="11" class="empty">
          Gagal mengambil data:
          ${escapeHtml(error.message)}
        </td>
      </tr>
    `;

    return;
  }


  bookings = data || [];

  updateStats();

  filterBookings();

}


/* =========================
   STATISTICS
========================= */

function updateStats(){

  document.getElementById(
    "totalBooking"
  ).textContent =
    bookings.length;


  document.getElementById(
    "waitingBooking"
  ).textContent =
    bookings.filter(
      b => b.status === "Menunggu"
    ).length;


  document.getElementById(
    "processBooking"
  ).textContent =
    bookings.filter(
      b => b.status === "Diproses"
    ).length;


  document.getElementById(
    "doneBooking"
  ).textContent =
    bookings.filter(
      b => b.status === "Selesai"
    ).length;

}


/* =========================
   FILTER
========================= */

function filterBookings(){

  const search =
    document.getElementById(
      "searchInput"
    ).value
      .toLowerCase();


  const status =
    document.getElementById(
      "statusFilter"
    ).value;


  const result =
    bookings.filter(b => {

      const text = `
        ${b.booking_code || ""}
        ${b.customer_name || ""}
        ${b.phone || ""}
        ${b.device || ""}
        ${b.damage || ""}
        ${b.description || ""}
        ${b.address || ""}
      `.toLowerCase();


      return (
        text.includes(search) &&
        (
          !status ||
          b.status === status
        )
      );

    });


  renderBookings(result);

}


/* =========================
   RENDER
========================= */

function renderBookings(data){

  const tbody =
    document.getElementById(
      "bookingTable"
    );


  if(!data.length){

    tbody.innerHTML = `
      <tr>
        <td colspan="11" class="empty">
          Tidak ada booking.
        </td>
      </tr>
    `;

    return;
  }


  tbody.innerHTML =
    data.map(b => {

      const price =
        Number(
          b.total_price ||
          b.estimated_price ||
          0
        )
        .toLocaleString("id-ID");


      const date =
        b.created_at
          ? new Date(
              b.created_at
            ).toLocaleString("id-ID")
          : "-";


      return `

        <tr>

          <td>
            <span class="code">
              ${escapeHtml(
                b.booking_code || "-"
              )}
            </span>
          </td>


          <td>
            ${escapeHtml(
              b.customer_name || "-"
            )}
          </td>


          <td>
            ${escapeHtml(
              b.phone || "-"
            )}
          </td>


          <td>
            ${escapeHtml(
              b.device || "-"
            )}
          </td>


          <td>
            ${escapeHtml(
              b.damage || "-"
            )}
          </td>


          <td>
            <div class="description">
              ${escapeHtml(
                b.description ||
                "Belum ada keterangan"
              )}
            </div>
          </td>


          <td>
            ${escapeHtml(
              b.address || "-"
            )}
          </td>


          <td>
            ${statusBadge(
              b.status
            )}
          </td>


          <td>
            Rp ${price}
          </td>


          <td>
            ${date}
          </td>


          <td>

            <div class="actions">

              <button
                class="action detail-btn"
                onclick="openDetail('${escapeJs(b.id)}')"
              >
                📝 Detail
              </button>


              <button
                class="action wa-btn"
                onclick="openWhatsApp('${escapeJs(b.phone)}')"
              >
                💬 WA
              </button>


              <button
                class="action map-btn"
                onclick="openMap(
                  '${escapeJs(b.latitude)}',
                  '${escapeJs(b.longitude)}',
                  '${escapeJs(b.address)}'
                )"
              >
                📍 Map
              </button>


              <button
                class="action nota-btn"
                onclick="openNota('${escapeJs(b.booking_code)}')"
              >
                🧾 Nota
              </button>

            </div>

          </td>

        </tr>

      `;

    }).join("");

}


/* =========================
   STATUS BADGE
========================= */

function statusBadge(status){

  const value =
    status || "Menunggu";

  let cls =
    "status-menunggu";


  if(value === "Diproses")
    cls = "status-diproses";


  if(value === "Selesai")
    cls = "status-selesai";


  if(value === "Sudah Diambil")
    cls = "status-diambil";


  if(value === "Dibatalkan")
    cls = "status-batal";


  return `
    <span class="status ${cls}">
      ${escapeHtml(value)}
    </span>
  `;

}


/* =========================
   DETAIL MODAL
========================= */

function openDetail(id){

  selectedBooking =
    bookings.find(
      b => b.id === id
    );


  if(!selectedBooking){

    alert(
      "Data booking tidak ditemukan."
    );

    return;
  }


  document.getElementById(
    "detailBookingCode"
  ).textContent =
    selectedBooking.booking_code ||
    "-";


  document.getElementById(
    "detailData"
  ).innerHTML = `

    <div class="detail-label">
      Nama Pelanggan
    </div>

    <div class="detail-value">
      ${escapeHtml(
        selectedBooking.customer_name || "-"
      )}
    </div>


    <div class="detail-label">
      WhatsApp
    </div>

    <div class="detail-value">
      ${escapeHtml(
        selectedBooking.phone || "-"
      )}
    </div>


    <div class="detail-label">
      Perangkat
    </div>

    <div class="detail-value">
      ${escapeHtml(
        selectedBooking.device || "-"
      )}
    </div>


    <div class="detail-label">
      Kerusakan
    </div>

    <div class="detail-value">
      ${escapeHtml(
        selectedBooking.damage || "-"
      )}
    </div>


    <div class="detail-label">
      Alamat
    </div>

    <div class="detail-value">
      ${escapeHtml(
        selectedBooking.address || "-"
      )}
    </div>

    <div class="detail-label">
      Status Pembayaran
    </div>

    <div class="detail-value">
      ${escapeHtml(selectedBooking.payment_status || "Belum Dibayar")}
    </div>

    <div class="detail-label">
      Metode Pembayaran
    </div>

    <div class="detail-value">
      ${escapeHtml(selectedBooking.payment_method || "-")}
    </div>

    <div class="detail-label">
      Waktu Pembayaran
    </div>

    <div class="detail-value">
      ${escapeHtml(selectedBooking.payment_paid_at
        ? new Date(selectedBooking.payment_paid_at).toLocaleString("id-ID")
        : "-")}
    </div>

  `;


  document.getElementById(
    "descriptionInput"
  ).value =
    selectedBooking.description || "";


  document.getElementById(
    "priceInput"
  ).value =
    selectedBooking.total_price ||
    selectedBooking.estimated_price ||
    0;


  document.getElementById(
    "statusInput"
  ).value =
    selectedBooking.status ||
    "Menunggu";


  document.getElementById(
    "detailModal"
  ).style.display = "flex";

}


function closeDetailModal(){

  document.getElementById(
    "detailModal"
  ).style.display = "none";

  selectedBooking = null;

}


/* =========================
   SAVE DETAIL
========================= */

async function saveDetail(){

  if(!selectedBooking){

    return;
  }


  const description =
    document.getElementById(
      "descriptionInput"
    ).value.trim();


  const price =
    Number(
      document.getElementById(
        "priceInput"
      ).value
    );


  const status =
    document.getElementById(
      "statusInput"
    ).value;


  if(isNaN(price) || price < 0){

    alert(
      "Harga tidak valid."
    );

    return;
  }


  /* SIMPAN KETERANGAN */

  const descriptionUpdate =
    await supabaseClient
      .from("bookings")
      .update({
        description:description
      })
      .eq(
        "id",
        selectedBooking.id
      );


  if(descriptionUpdate.error){

    console.error(
      descriptionUpdate.error
    );

    alert(
      "Keterangan gagal disimpan:\n" +
      descriptionUpdate.error.message
    );

    return;
  }


  /* SIMPAN STATUS */

  const statusUpdate =
    await supabaseClient
      .from("bookings")
      .update({
        status:status
      })
      .eq(
        "id",
        selectedBooking.id
      );


  if(statusUpdate.error){

    console.error(
      statusUpdate.error
    );

    alert(
      "Status gagal disimpan:\n" +
      statusUpdate.error.message
    );

    return;
  }


  /* SIMPAN HARGA */

  const priceUpdate =
    await supabaseClient.rpc(
      "update_booking_price",
      {
        p_booking_id:
          selectedBooking.id,

        p_price:
          price
      }
    );


  if(priceUpdate.error){

    console.error(
      priceUpdate.error
    );

    alert(
      "Harga gagal disimpan:\n" +
      priceUpdate.error.message
    );

    return;
  }


  alert(
    "Data service berhasil disimpan."
  );


  closeDetailModal();

  await loadBookings();

}


/* =========================
   WHATSAPP
========================= */

function openWhatsApp(phone){

  if(!phone){

    alert(
      "Nomor WhatsApp tidak tersedia."
    );

    return;
  }


  let number =
    String(phone)
      .replace(/\D/g,"");


  if(number.startsWith("0")){

    number =
      "62" +
      number.substring(1);

  }


  window.open(
    "https://wa.me/" +
    number,
    "_blank"
  );

}


/* =========================
   MAP
========================= */

function openMap(
  latitude,
  longitude,
  address
){

  if(
    latitude &&
    longitude &&
    latitude !== "null" &&
    longitude !== "null"
  ){

    window.open(
      "https://www.google.com/maps?q=" +
      encodeURIComponent(
        latitude + "," + longitude
      ),
      "_blank"
    );

    return;
  }


  if(address){

    window.open(
      "https://www.google.com/maps/search/?api=1&query=" +
      encodeURIComponent(address),
      "_blank"
    );

    return;
  }


  alert(
    "Lokasi tidak tersedia."
  );

}


/* =========================
   NOTA
========================= */

function openNota(code){

  if(!code){

    alert(
      "Kode booking tidak ditemukan."
    );

    return;
  }


  const url =
    "./nota.html?code=" +
    encodeURIComponent(code);


  window.open(
    url,
    "_blank"
  );

}


/* =========================
   ESCAPE
========================= */

function escapeHtml(value){

  return String(value ?? "")
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");

}


function escapeJs(value){

  return String(value ?? "")
    .replace(/\\/g,"\\\\")
    .replace(/'/g,"\\'")
    .replace(/\n/g,"\\n")
    .replace(/\r/g,"\\r");

}

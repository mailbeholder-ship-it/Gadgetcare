<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Home Service Cell | Servis HP ke Rumah</title>

<!-- Leaflet -->
<link
    rel="stylesheet"
    href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
/>

<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

body {
    font-family: Arial, sans-serif;
    background: #080b12;
    color: #fff;
    line-height: 1.6;
}

a {
    text-decoration: none;
    color: inherit;
}

.container {
    width: 92%;
    max-width: 1100px;
    margin: auto;
}

/* NAVBAR */

header {
    position: sticky;
    top: 0;
    z-index: 1000;
    background: rgba(8,11,18,.96);
    border-bottom: 1px solid #202938;
}

.navbar {
    min-height: 70px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
}

.logo {
    font-size: 19px;
    font-weight: bold;
    display: flex;
    align-items: center;
}

.logo-icon {
    width: 38px;
    height: 38px;
    border-radius: 10px;
    background: #19d5ff;
    color: #061018;
    display: flex;
    align-items: center;
    justify-content: center;
    margin-right: 8px;
}

.nav-links {
    display: flex;
    gap: 8px;
}

.nav-button {
    background: #19d5ff;
    color: #061018;
    padding: 9px 14px;
    border-radius: 9px;
    font-size: 13px;
    font-weight: bold;
}

/* HERO */

.hero {
    padding: 90px 0;
    background:
        radial-gradient(
            circle at 80% 20%,
            #123b50,
            transparent 35%
        );
}

.tag {
    color: #19d5ff;
    font-size: 13px;
    font-weight: bold;
    letter-spacing: 2px;
}

.hero h1 {
    font-size: clamp(40px,8vw,70px);
    line-height: 1.05;
    margin: 15px 0;
}

.hero h1 span {
    color: #19d5ff;
}

.hero p {
    color: #aab5c2;
    max-width: 650px;
    font-size: 18px;
}

.buttons {
    margin-top: 30px;
    display: flex;
    gap: 12px;
    flex-wrap: wrap;
}

.button {
    display: inline-block;
    padding: 14px 22px;
    border-radius: 12px;
    background: #19d5ff;
    color: #061018;
    font-weight: bold;
    border: none;
    cursor: pointer;
}

.button-outline {
    background: transparent;
    color: white;
    border: 1px solid #344052;
}

/* SECTION */

section {
    padding: 70px 0;
}

.section-title {
    margin-bottom: 30px;
}

.section-title small {
    color: #19d5ff;
    font-weight: bold;
    letter-spacing: 2px;
}

.section-title h2 {
    font-size: 34px;
    margin-top: 5px;
}

.section-title p {
    color: #9ca8b5;
}

/* SERVICES */

.services {
    display: grid;
    grid-template-columns:
        repeat(auto-fit,minmax(220px,1fr));
    gap: 15px;
}

.service {
    background: #0e141e;
    border: 1px solid #202b39;
    padding: 22px;
    border-radius: 16px;
    transition: .3s;
}

.service:hover {
    transform: translateY(-4px);
    border-color: #19d5ff;
}

.service-icon {
    font-size: 30px;
    margin-bottom: 10px;
}

.service h3 {
    margin-bottom: 8px;
}

.service p {
    color: #929eac;
    font-size: 14px;
}

/* PRICE */

.price-section {
    background: #0b1018;
}

.prices {
    display: grid;
    gap: 10px;
}

.price {
    display: flex;
    justify-content: space-between;
    gap: 15px;
    padding: 17px;
    background: #101720;
    border: 1px solid #222e3c;
    border-radius: 12px;
}

.price strong {
    color: #19d5ff;
}

.note {
    color: #778391;
    margin-top: 15px;
    font-size: 13px;
}

/* BOOKING */

.booking-box {
    max-width: 800px;
    background: #0e141e;
    border: 1px solid #202b39;
    padding: 25px;
    border-radius: 18px;
}

.form-group {
    margin-bottom: 17px;
}

label {
    display: block;
    margin-bottom: 7px;
    font-weight: bold;
    font-size: 14px;
}

input,
select,
textarea {
    width: 100%;
    padding: 13px;
    background: #080d14;
    color: white;
    border: 1px solid #293646;
    border-radius: 10px;
    outline: none;
    font-size: 15px;
}

input:focus,
select:focus,
textarea:focus {
    border-color: #19d5ff;
}

textarea {
    resize: vertical;
}

.submit {
    width: 100%;
    font-size: 16px;
}

/* MAP */

#map {
    width: 100%;
    height: 350px;
    border-radius: 14px;
    overflow: hidden;
    border: 1px solid #293646;
}

.location-status {
    color: #19d5ff;
    font-size: 13px;
    margin-top: 8px;
}

/* STATUS */

.status-result {
    display: none;
    margin-top: 20px;
    padding: 20px;
    background: #101720;
    border: 1px solid #222e3c;
    border-radius: 12px;
}

.status-result p {
    margin-bottom: 8px;
}

.total-price {
    margin-top: 15px;
    padding: 15px;
    background: #0b1921;
    border: 1px solid #19d5ff;
    border-radius: 10px;
}

.total-price-label {
    font-size: 13px;
    color: #9ca8b5;
}

.total-price-value {
    color: #19d5ff;
    font-size: 25px;
    font-weight: bold;
    margin-top: 3px;
}

.status-badge {
    display: inline-block;
    padding: 5px 10px;
    border-radius: 8px;
    background: #172631;
    color: #19d5ff;
    font-weight: bold;
}

/* FOOTER */

footer {
    padding: 30px 0;
    border-top: 1px solid #202938;
    color: #7f8a97;
    text-align: center;
